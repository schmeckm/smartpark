name: smart-park-os

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: smartpark
      POSTGRES_DB: smartpark
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartpark -d smartpark']
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0.18
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  # InfluxDB 2 OSS — OT metric historian (Sparkplug DDATA numerics). Start with: docker compose up -d influxdb
  # UI: http://127.0.0.1:8086 (dev token matches INFLUX_TOKEN default in .env.example when using compose).
  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - '8086:8086'
    volumes:
      - influxdata:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: smartpark_admin_change_me
      DOCKER_INFLUXDB_INIT_ORG: smartpark
      DOCKER_INFLUXDB_INIT_BUCKET: ot_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: smart-park-local-dev-influx-token-not-for-prod

  api:
    build: .
    restart: unless-stopped
    # Mount source so UNS / MQTT route changes apply without rebuilding the image (restart api after edits).
    # Persist adapter install YAML (emitEnabled / ingestCanonicalEnabled), pipeline logs, calendar data — without this,
    # `data/` lives only in the container layer and resets when the container is recreated.
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Docker network only — do NOT use ${DB_HOST}: root .env is for host `npm start` (127.0.0.1:15432).
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smartpark
      DB_USER: smartpark
      DB_PASSWORD: smartpark
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      # Integration Flow Studio + /api/v1/integration-flows/* (set false in .env for prod-like runs).
      INTEGRATION_FLOW_ENGINE_ENABLED: ${INTEGRATION_FLOW_ENGINE_ENABLED:-true}
      INTEGRATION_FLOW_CONCURRENCY: ${INTEGRATION_FLOW_CONCURRENCY:-3}
      # Widget Runtime Studio + /api/v1/widget-runtime/* — set false in .env for prod-like runs.
      WIDGET_RUNTIME_ENABLED: ${WIDGET_RUNTIME_ENABLED:-true}
      # API must use the compose service name — not 127.0.0.1 (that is only from your Windows host).
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      # Default mqtt://mqtt:1883 when unset; do not set MQTT_BROKER_URL=127.0.0.1 in root .env for compose.
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mqtt:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-smart-park-os-api}
      # ML observability / metadata (Phase 1–4). Compose defaults all three on for local E2E (profiles → trace → Weighted X).
      # Override in .env for prod-like runs (e.g. ML_FEATURE_WEIGHTS_ENABLED=false). See docs/architecture/ml-forecast-phased-roadmap.md
      ML_TRACE_ENABLED: ${ML_TRACE_ENABLED:-true}
      ML_PROFILE_ENABLED: ${ML_PROFILE_ENABLED:-true}
      ML_FEATURE_WEIGHTS_ENABLED: ${ML_FEATURE_WEIGHTS_ENABLED:-true}
      # Pass through from project .env (Compose loads .env for substitution). Enables Open-Meteo → weather_observations.
      WEATHER_OPEN_METEO_ENABLED: ${WEATHER_OPEN_METEO_ENABLED:-true}
      WEATHER_OPEN_METEO_INTERVAL_SECONDS: ${WEATHER_OPEN_METEO_INTERVAL_SECONDS:-300}
      WEATHER_OPEN_METEO_REBUILD_SNAPSHOTS: ${WEATHER_OPEN_METEO_REBUILD_SNAPSHOTS:-true}
      WEATHER_OPEN_METEO_FETCH_RETRIES: ${WEATHER_OPEN_METEO_FETCH_RETRIES:-3}
      WEATHER_OPEN_METEO_RETRY_BASE_MS: ${WEATHER_OPEN_METEO_RETRY_BASE_MS:-500}
      # Influx (optional): set INFLUX_ENABLED=true when influxdb service is running (see .env.example).
      INFLUX_ENABLED: ${INFLUX_ENABLED:-false}
      # Docker network only — host .env often uses http://127.0.0.1:8086 (mapped port), which fails inside the container.
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-smart-park-local-dev-influx-token-not-for-prod}
      INFLUX_ORG: ${INFLUX_ORG:-smartpark}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-ot_metrics}
      INFLUX_FLOAT_EPSILON: ${INFLUX_FLOAT_EPSILON:-1e-9}
      INFLUX_MIN_WRITE_INTERVAL_MS: ${INFLUX_MIN_WRITE_INTERVAL_MS:-0}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      influxdb:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: admin-dashboard/Dockerfile
      target: development
    ports:
      - '5173:5173'
    depends_on:
      - api
    environment:
      # Leave VITE_API_URL unset so the browser uses same-origin /api and Vite proxies to the API
      # (works with http://127.0.0.1:5173 and http://<LAN-IP>:5173). Do not set to localhost:3000 in Docker.
      CHOKIDAR_USEPOLLING: 'true'
      VITE_PROXY_API_TARGET: http://api:3000
      GIT_COMMIT: ${GIT_COMMIT:-}
    volumes:
      - ./admin-dashboard:/app
      # Vite resolves `@smartpark-root-utils/*` from here (parent `src/utils` is not visible under `/app` only).
      - ./src/utils:/app/monorepo-src-utils:ro
      # Persists node_modules; after new npm deps (e.g. @vue-flow/*), restart frontend so entrypoint runs npm ci,
      # or: docker compose down -v  (drops frontend_node_modules) then docker compose up.
      - frontend_node_modules:/app/node_modules
      # Schützt den Container davor, dass lokale Node-Module vom Host eingespielt werden
      - /app/node_modules

volumes:
  pgdata:
  influxdata:
  frontend_node_modules:
