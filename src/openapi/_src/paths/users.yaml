/users/me/settings:
  get:
    tags:
      - Platform
    summary: 'Current user UI and regional settings'
    description: 'Authenticated user; no extra permission key beyond valid JWT.'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
  patch:
    tags:
      - Platform
    summary: 'Patch current user settings'
    description: 'At least one of language, display name, timezone, date/time format, locale, or nested **`uiPreferences`**.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsPatchBody'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '422':
        description: 'Validation error'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorBody'
