'/sqdc/parks/{parkId}/board':
  parameters:
    -
      in: path
      name: parkId
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags:
      - SQDC
    summary: 'Hierarchical SQDC board (park)'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
'/sqdc/parks/{parkId}/assets/{assetId}/board':
  parameters:
    -
      in: path
      name: parkId
      required: true
      schema:
        type: string
        format: uuid
    -
      in: path
      name: assetId
