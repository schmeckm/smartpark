        in: query
        name: parkZoneId
        schema:
          type: string
          format: uuid
      -
        in: query
        name: activeFlag
        schema:
          type: boolean
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmRideList'
  post:
    tags:
      - MDM
    summary: 'Create MDM ride'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MdmRideCreate'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmRideDetail'
'/mdm/rides/{id}':
  parameters:
    -
      $ref: '#/components/parameters/IdPath'
  get:
    tags:
      - MDM
    summary: 'Get MDM ride with extensions'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmRideDetail'
      '404':
        $ref: '#/components/responses/NotFound'
  put:
    tags:
      - MDM
    summary: 'Update MDM ride'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MdmRideUpdate'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmRideDetail'
'/mdm/rides/{id}/extensions':
  get:
    tags:
      - MDM
    summary: 'Read UNS signal extension metadata (read-only, Phase C)'
    description: 'Normalized domains, per-signal hints, and coarse capabilities from `mdm_rides.extensions`. Missing data returns empty structures.'
    parameters:
      -
        $ref: '#/components/parameters/IdPath'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeRideMasterExtensionsRead'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
      - MDM
    summary: 'Patch UNS ride extensions metadata (Phase E)'
    description: 'Merged with `mergeExtensions`; persists `mdm_rides.extensions`. Requires `rides` update permission. Signal keys must be `domain.metric` with a supported domain; `replaceSignals` + `signals` replaces the whole signal map.'
    parameters:
      -
        $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RideMasterExtensionsPatch'
    responses:
      '200':
        description: 'OK — normalized read DTO'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeRideMasterExtensionsRead'
      '400':
        description: 'Invalid body (unknown domains, invalid signal keys, or replaceSignals without signals)'
      '404':
        $ref: '#/components/responses/NotFound'
'/mdm/rides/{id}/active':
  patch:
    tags:
      - MDM
    summary: 'Activate or deactivate ride'
    parameters:
