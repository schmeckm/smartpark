/mdm/parks:
  get:
    tags:
      - MDM
    summary: 'List master-data parks'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmParks'
  post:
    tags:
      - MDM
    summary: 'Create park'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MdmParkCreate'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmParkOne'
'/mdm/parks/{parkId}/zones':
  parameters:
    -
      in: path
      name: parkId
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags:
      - MDM
    summary: 'List zones in park'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmZones'
  post:
    tags:
      - MDM
    summary: 'Create zone'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MdmZoneCreate'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmZoneOne'
/mdm/ride-types:
