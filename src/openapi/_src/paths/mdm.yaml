'/mdm/ride-templates/{templateId}/clone-ride':
  post:
    tags:
      - MDM
    summary: 'Create MDM ride from template (applies default profile)'
    parameters:
      -
        in: path
        name: templateId
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MdmCloneFromTemplateBody'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeMdmRideDetail'
/mdm/rides:
  get:
    tags:
      - MDM
    summary: 'List MDM rides'
    parameters:
      -
        in: query
        name: parkId
        schema:
          type: string
          format: uuid
