/agent/runs:
  get:
    tags:
      - Agent
    summary: 'List agent runs for scoped park'
    description: 'Needs **`agent.read`**, **`X-Park-Id`**, and optional filters (`limit`, `offset`, `skillId`, `status`).'
    parameters:
      -
        in: header
        name: X-Park-Id
        required: true
        schema:
          type: string
          format: uuid
      -
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      -
        in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      -
        in: query
        name: skillId
        schema:
          type: string
      -
        in: query
        name: status
        schema:
          type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
  post:
    tags:
      - Agent
    summary: 'Trigger an agent skill run (manual)'
    description: "Needs **`agent.run`** and **`X-Park-Id`**. Body **`parkId`** must match the active park context.\nSupports **`daily_executive_brief`**, **`crowd_spike_triage`**, **`mapping_assistant`**, **`weather_pivot`**, and **`ride_down_response`** (suggest skills propose actions for approval).\n"
    parameters:
      -
        in: header
        name: X-Park-Id
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - skillId
              - parkId
            properties:
              skillId:
                type: string
                enum:
                  - daily_executive_brief
                  - crowd_spike_triage
                  - mapping_assistant
                  - weather_pivot
                  - ride_down_response
              parkId:
                type: string
                format: uuid
              triggerType:
                type: string
                default: manual
              crowdEventId:
                type: string
                format: uuid
                nullable: true
                description: 'Optional crowd event (`crowd_events.id`) for `crowd_spike_triage` context.'
              rideId:
                type: string
                format: uuid
                nullable: true
                description: 'Optional ride / park asset id (`park_assets.asset_id`) for `ride_down_response` focus context.'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '422':
        description: Validation error

'/agent/runs/{id}':
  parameters:
    -
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    -
      in: header
      name: X-Park-Id
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags:
      - Agent
    summary: 'Get agent run detail with steps and actions'
    description: 'Needs **`agent.read`** and **`X-Park-Id`**. Returns ordered **`steps`** and **`actions`** for audit trace.'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        description: Not found
