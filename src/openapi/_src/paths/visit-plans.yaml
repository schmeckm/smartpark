/visit-plans:
  get:
    tags:
      - VisitPlanning
    summary: 'List visit plans'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
  post:
    tags:
      - VisitPlanning
    summary: 'Create visit plan'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
'/visit-plans/{id}/export/xlsx':
  parameters:
    -
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags:
      - VisitPlanning
    summary: 'Export visit plan XLSX'
    responses:
      '200':
        description: OK
'/visit-plans/{id}/import/xlsx':
