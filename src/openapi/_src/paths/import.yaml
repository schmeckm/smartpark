/import/staff:
  post:
    tags:
      - Wave2
    summary: 'Import staff CSV/XLSX (multipart)'
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
    responses:
