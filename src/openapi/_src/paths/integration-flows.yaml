/integration-flows/from-template:
  post:
    tags:
      - Integrations
    summary: Create integration flow from a predefined template
    description: 'Merges whitelisted `configOverrides`, validates `flowJson`, then creates a definition. Requires **integrations.manage**.'
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationFlowFromTemplateRequest'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowDefinition'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'

/integration-flows/{id}:
  get:
    tags:
      - Integrations
    summary: Get integration flow definition
    security:
      -
        bearerAuth: []
    parameters:
      -
        $ref: '#/components/parameters/IdPath'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowDefinition'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
      - Integrations
    summary: Update integration flow definition
    security:
      -
        bearerAuth: []
    parameters:
      -
        $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              parkId:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              description:
                type: string
                nullable: true
              enabled:
                type: boolean
              triggerType:
                type: string
              flowJson:
                $ref: '#/components/schemas/IntegrationFlowJson'
              scheduleEnabled:
                type: boolean
              scheduleIntervalSeconds:
                type: integer
                nullable: true
                enum:
                  - 60
                  - 300
                  - 900
                  - 1800
                  - 3600
              retryEnabled:
                type: boolean
              maxRetryAttempts:
                type: integer
                enum:
                  - 0
                  - 1
                  - 2
                  - 3
              retryDelaySeconds:
                type: integer
                nullable: true
                enum:
                  - 60
                  - 300
                  - 900
              retryOnNodeTypes:
                type: array
                nullable: true
                items:
                  type: string
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowDefinition'
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'
  delete:
    tags:
      - Integrations
    summary: Delete integration flow definition (historical runs retained; `flowId` nulled)
    security:
      -
        bearerAuth: []
    parameters:
      -
        $ref: '#/components/parameters/IdPath'
    responses:
      '204':
        description: No content
      '404':
        $ref: '#/components/responses/NotFound'

/integration-flows/{id}/schedule/recalculate:
  post:
    tags:
      - Integrations
    summary: Recalculate next scheduled run from now
    description: 'Sets `nextScheduledRunAt` to now + interval. Requires an enabled flow with `scheduleEnabled` and a valid `scheduleIntervalSeconds`. Requires **integrations.manage**. Flag-gated **404** when the engine is disabled.'
    security:
      -
        bearerAuth: []
    parameters:
      -
        $ref: '#/components/parameters/IdPath'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowDefinition'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'

