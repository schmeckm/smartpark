/integration-flows/failures:
  get:
    tags:
      - Integrations
    summary: List failed integration flow runs (failure inbox)
    description: 'Returns failed runs with derived failed-step metadata and flow names. Supports filters and pagination. Requires **integrations.read** and `INTEGRATION_FLOW_ENGINE_ENABLED`.'
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: flowId
        in: query
        schema:
          type: string
          format: uuid
      -
        name: retryStatus
        in: query
        schema:
          type: string
          enum:
            - not_applicable
            - pending_retry
            - retry_succeeded
            - retry_failed
            - retry_exhausted
      -
        name: nodeType
        in: query
        schema:
          type: string
      -
        name: acknowledged
        in: query
        schema:
          type: string
          enum:
            - yes
            - no
            - all
      -
        name: from
        in: query
        schema:
          type: string
          format: date-time
      -
        name: to
        in: query
        schema:
          type: string
          format: date-time
      -
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      -
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowFailureInboxPage'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'

/integration-flows/runs/{runId}:
  get:
    tags:
      - Integrations
    summary: Get integration flow run (with steps and timeline)
    description: 'Returns a persisted run including `steps` and a derived `timeline` from step rows. Requires `INTEGRATION_FLOW_ENGINE_ENABLED` and **integrations.read**. When the flag is off, responds **404**.'
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowRun'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'

/integration-flows/runs/{runId}/acknowledge:
  post:
    tags:
      - Integrations
    summary: Acknowledge a failed integration flow run
    description: 'Records acknowledgement metadata without changing run status, retry fields, or step rows. Requires **integrations.manage**.'
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationFlowAcknowledgeRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowFailureInboxItem'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'

/integration-flows/runs/{runId}/retry:
  post:
    tags:
      - Integrations
    summary: Manually retry a failed integration flow run
    description: 'Creates a new run linked to the failed run when the flow is enabled and retry is configured. Requires **integrations.manage**. Does not mutate original step rows.'
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowRunResult'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'

/integration-flows:
  get:
    tags:
      - Integrations
    summary: List integration flow definitions
    description: 'Requires **integrations.read**. Flag-gated: **404** when disabled.'
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: parkId
        in: query
        schema:
          type: string
          format: uuid
      -
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      -
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowDefinitionList'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
  post:
    tags:
      - Integrations
    summary: Create integration flow definition
    description: 'Validates `flowJson` graph. Requires **integrations.manage**.'
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationFlowCreateRequest'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFlowDefinition'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationError'

/integration-flows/templates:
  get:
    tags:
      - Integrations
    summary: List predefined integration flow templates
