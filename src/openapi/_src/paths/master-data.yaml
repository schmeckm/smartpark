'/master-data/{entityType}/import/xlsx':
  post:
    tags:
      - Admin
    summary: 'Import master-data from XLSX (`multipart/form-data`, field `file`)'
    description: 'Requires **`rides.update`**. Max upload 12MB (server multer).'
    parameters:
      -
        in: path
        name: entityType
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '422':
        description: 'Validation / parse error'
