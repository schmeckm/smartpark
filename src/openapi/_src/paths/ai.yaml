            - RIDE
            - SHOW
            - RESTAURANT
            - SHOP
            - ""
      -
        in: query
        name: completenessMax
        schema:
          type: number
      -
        in: query
        name: missingFeature
        schema:
          type: string
          enum:
            - weather
            - calendar
            - traffic
            - staffing
