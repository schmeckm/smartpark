/ai/health:
  get:
    tags:
      - AI
    summary: 'AI module health'
    description: 'Liveness and sampling config (unauthenticated, no RBAC)'
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAiHealth'
/ai/pipeline-health:
  get:
    tags:
      - AI
    summary: 'Last AI full-pipeline run and scheduler config'
    description: 'Needs `ai.read`. Optional smoke hints from `data/ai-smoke-status.json` when present.'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  additionalProperties: true
/ai/forecasts/refresh:
  post:
    tags:
      - AI
    summary: 'Sample zones and regenerate baseline crowd forecasts'
    description: 'Needs permission `ai.refresh`'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAiRefresh'
/ai/forecasts:
  get:
    tags:
      - AI
    summary: 'List current forecasts'
    description: 'Optional filters; needs `ai.read`'
    parameters:
      -
        in: query
        name: horizonMinutes
        schema:
          type: integer
          minimum: 1
      -
        in: query
        name: subjectType
        schema:
          type: string
          enum:
            - PARK
            - ZONE
            - RIDE
      -
        in: query
        name: targetMetric
        schema:
          type: string
          enum:
            - CROWD_LEVEL
            - WAIT_TIME
            - STAFF_DEMAND
      -
        in: query
        name: limit
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 200
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeForecasts'
/ai/insights/summary:
  get:
    tags:
      - AI
    summary: 'Top hotspot summary (60 min baseline)'
    description: 'Needs `ai.read`'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAiInsights'
/ai/pipeline-runs:
  get:
    tags:
      - AI
    summary: 'Recent AI pipeline / ingestion runs (admin diagnostics)'
    description: 'Needs **`ai.read`**. Optional **`limit`** (1–100, default 25).'
    parameters:
      -
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
/ai/studio/catalog:
  get:
    tags:
      - AI
    summary: 'ML Studio catalog (features, targets, algorithms)'
    description: 'Needs **`ai.read`**.'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
/ai/studio/dataset-stats:
  get:
    tags:
      - AI
    summary: 'ML Studio dataset statistics for an entity'
    description: 'Needs **`ai.read`**, **`X-Park-Id`**, and merged query validation (`entityType`, optional `entityId`, `dataset`).'
    parameters:
      -
        in: query
        name: entityType
        required: true
        schema:
          type: string
          description: 'e.g. RIDE'
          park_asset: 'per server allowlist'
      -
        in: query
        name: entityId
        schema:
          type: string
          format: uuid
      -
        in: query
        name: dataset
        schema:
          type: string
          enum:
            - FEATURE_STORE
            - SANDBOX
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '422':
        description: 'Validation error'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorBody'
/ai/studio/models:
  get:
    tags:
      - AI
    summary: 'List ML Studio trained model rows (park-scoped)'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**. Supports filters `entityType`, `targetVariable`, `modelScope`, `activeOnly`, `limit`.'
    parameters:
      -
        in: query
        name: entityType
        schema:
          type: string
      -
        in: query
        name: targetVariable
        schema:
          type: string
      -
        in: query
        name: modelScope
        schema:
          type: string
          enum:
            - entity
            - category
            - park
      -
        in: query
        name: activeOnly
        schema:
          type: string
          enum:
            - 'true'
            - 'false'
      -
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
'/ai/studio/models/{id}':
  get:
    tags:
      - AI
    summary: 'Get one ML Studio model by id'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**.'
    parameters:
      -
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        description: 'Not found'
/ai/studio/models/train:
  post:
    tags:
      - AI
    summary: 'Train an ML Studio model (sandbox or feature-store dataset)'
    description: 'Needs **`ai.refresh`** and **`X-Park-Id`**. Body is validated server-side (dataset, entityType, targetVariable, features, strategy, algorithm). See `ai-studio.validators.js`.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiStudioTrainRequest'
    responses:
      '200':
        description: 'OK (or 201 depending on implementation)'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '422':
        description: 'Validation / business rules'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorBody'
'/ai/studio/models/{id}/activate':
  patch:
    tags:
      - AI
    summary: 'Activate or deactivate one ML Studio model'
    description: 'Needs **`ai.refresh`** and **`X-Park-Id`**. Path **`id`** and body **`activeFlag`** required.'
    parameters:
      -
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - activeFlag
            properties:
              activeFlag:
                type: boolean
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '404':
        description: 'Not found'
      '422':
        description: 'Validation error'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorBody'
/ai/studio/predict:
  post:
    tags:
      - AI
    summary: 'ML Studio dry-run prediction from manual features or latest snapshot'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**. Validated per `predictBody` in `ai-studio.validators.js`.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiStudioPredictRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
      '422':
        description: 'Validation error'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorBody'
/ai/forecast-accuracy/zone-crowd:
  get:
    tags:
      - AI
    summary: 'Zone crowd forecast accuracy metrics'
    description: 'Needs **`ai.read`**. Query **`days`** (1–90), **`horizonMinutes`** (15, 60, or 180), optional **`limitForecasts`**.'
    parameters:
      -
        in: query
        name: days
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
      -
        in: query
        name: horizonMinutes
        schema:
          type: integer
          enum:
            - 15
            - 60
            - 180
          default: 60
      -
        in: query
        name: limitForecasts
        schema:
          type: integer
          minimum: 50
          maximum: 800
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
/ai/timeseries/rides-current:
  get:
    tags:
      - AI
    summary: 'Current ride wait snapshot series for the active park'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**. Query **`hours`** (1–168, default 24).'
    parameters:
      -
        in: query
        name: hours
        schema:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
/ai/training-dataset:
  get:
    tags:
      - AI
    summary: 'Sample rows from the training feature dataset (park-scoped)'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**. Query **`target`** (`queue_time_15m` \| `queue_time_60m` \| `queue_time_120m`), **`limit`** (1–2000).'
    parameters:
      -
        in: query
        name: target
        schema:
          type: string
          enum:
            - queue_time_15m
            - queue_time_60m
            - queue_time_120m
          default: queue_time_15m
      -
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 400
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
'/ai/timeseries/rides/{assetId}':
  get:
    tags:
      - AI
    summary: 'Ride wait time series for one asset'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**. Query **`from`** / **`to`** ISO datetimes required; optional **`includeContext`** (boolean).'
    parameters:
      -
        in: path
        name: assetId
        required: true
        schema:
          type: string
          format: uuid
      -
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      -
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      -
        in: query
        name: includeContext
        schema:
          type: boolean
          default: true
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
