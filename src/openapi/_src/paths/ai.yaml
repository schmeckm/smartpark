            - RIDE
            - SHOW
            - RESTAURANT
            - SHOP
            - ""
      -
        in: query
        name: completenessMax
        schema:
          type: number
      -
        in: query
        name: missingFeature
        schema:
          type: string
          enum:
            - weather
            - calendar
            - traffic
            - staffing
            - ""
      -
        in: query
        name: confidenceMax
        schema:
          type: number
      -
        in: query
        name: provider
        schema:
          type: string
      -
        in: query
        name: summariesLimit
        schema:
          type: integer
          minimum: 10
          maximum: 300
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeGenericData'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
/ai/studio/feature-drafts:
  get:
    tags:
      - AI
    summary: 'Get ML Studio dataset feature draft (Phase P)'
    description: 'Needs `ai.read` and active park context (`X-Park-Id`). Returns persisted draft or `data: null`.'
    parameters:
      -
        in: query
        name: entityType
        required: true
        schema:
          type: string
          enum:
            - ride
            - park_asset
      -
        in: query
        name: entityId
        required: true
        schema:
          type: string
          format: uuid
      -
        in: query
        name: datasetScope
        schema:
          type: string
          enum:
            - single_asset
          default: single_asset
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAiStudioFeatureDraftNullable'
  put:
    tags:
      - AI
    summary: 'Save ML Studio dataset feature draft (Phase P)'
    description: "Needs `ai.refresh` and active park. Each `selectedSignalKey` must exist on ride/asset extensions with `enabled` and `mlEligible`\n(validated via the same **`signal-preview.service`** module as Add-on Board preview gates — **no** `signalPreview` or latest-value fields in this API).\nStored in `app_settings` key `aiStudio.featureDrafts` (JSON), scoped by park.\n"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiStudioFeatureDraftPut'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAiStudioFeatureDraft'
