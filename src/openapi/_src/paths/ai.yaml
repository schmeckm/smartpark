                  type: boolean
                data:
                  type: object
                  properties:
                    deleted:
                      type: integer
/ai/feature-store/park-snapshots/purge:
  post:
    tags:
      - AI
    summary: 'Bulk-delete park snapshots in a time window'
    description: 'Needs `ai.refresh` and X-Park-Id; range max 35 days.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: string
                description: ISO8601
              to:
                type: string
                description: ISO8601
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    deleted:
                      type: integer
/ai/feature-store/park-snapshots/bulk-delete:
  post:
    tags:
      - AI
    summary: 'Delete park snapshots by id list'
    description: 'Needs `ai.refresh` and X-Park-Id; max 200 UUIDs; only rows for that park are deleted.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - ids
            properties:
              ids:
                type: array
                maxItems: 200
                items:
                  type: string
                  format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    deleted:
                      type: integer
                    requested:
                      type: integer
