    summary: 'Feature completeness / quality dashboard for active park'
    description: 'Needs **`ai.read`** and **`X-Park-Id`**. Optional filters **`from`**, **`to`**, **`entityType`**, **`completenessMax`**, **`missingFeature`**, **`confidenceMax`**, **`provider`**, **`summariesLimit`** (see `featureDataQualityQuery`).'
    parameters:
