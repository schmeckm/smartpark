/integrations/logs:
  get:
    tags:
      - Wave2
    summary: 'Integration / ingestion log (canonical mount, Phase B3)'
    description: |
      Reads `integration_event_log` rows. Identical handler to the deprecated
      `GET /integration/logs` (singular) — the singular namespace is being folded
      into `/integrations/*`. New clients should use this path; existing
      `/integration/logs` consumers continue to work for the deprecation window.
      Requires the `integration.read` permission (NB: singular permission name,
      kept stable for backward compatibility with the legacy controller).
    parameters:
      -
        in: query
        name: limit
        schema:
          type: integer
          default: 100
      -
        in: query
        name: offset
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: OK
/integrations/feature-flags:
  get:
    tags:
      - Integrations
    summary: 'Read-only integration feature flags (server env)'
    description: 'Exposes non-secret booleans for admin UI (e.g. adapter discovery inbox, future MQTT capability gate). Requires **integrations.read** (same permission family as other Integration settings reads).'
    security:
      -
        bearerAuth: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeIntegrationFeatureFlags'
            examples:
              sample:
                value:
                  success: true
                  data:
                    adapterDiscoverySpyEnabled: true
                    mqttEnforceCapabilities: false
      '401':
        description: 'Missing or invalid JWT'
      '403':
        description: 'Missing integrations.read'
        content:
          application/json:
            examples:
              forbidden:
                value:
                  success: false
                  message: 'Insufficient permissions'
                  code: FORBIDDEN
