/integrations/output/encode:
  post:
    tags:
      - Integrations
    summary: 'Encode adapter observation for UNS JSON, Sparkplug JSON MVP, and/or canonical historian (no side effects)'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - observation
              - context
            properties:
              observation:
                type: object
                description: 'Normalized observation (domain'
                'assetSlug,': metric
                'value,': …)
              context:
                type: object
                description: 'Non-empty parkSlug and/or sparkplugGroupId (UNS_JSON uses sparkplugGroupId first when set).'
                properties:
                  parkSlug:
                    type: string
                  sparkplugGroupId:
                    type: string
              profiles:
                type: array
                items:
                  type: string
                  enum:
                    - uns_json
                    - sparkplug_json
                    - canonical_historian
    responses:
      '200':
        description: OK
/integrations/output/emit:
  post:
    tags:
      - Integrations
    summary: 'Encode and optionally publish MQTT and/or ingest canonical messages (integrations manage)'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - observation
              - context
            properties:
              observation:
                type: object
              context:
                type: object
              profiles:
                type: array
                items:
                  type: string
                  enum:
                    - uns_json
                    - sparkplug_json
                    - canonical_historian
              emitMqtt:
                type: boolean
                default: false
              ingestCanonical:
                type: boolean
                default: false
              autoApply:
                type: boolean
                default: true
    responses:
      '200':
        description: OK
/integrations/adapters/demo/run:
