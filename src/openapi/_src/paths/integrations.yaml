    tags:
      - Integrations
    summary: 'List installed adapter packages (DB + scan); install config is hydrated from YAML per adapterKey'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeInstalledAdapterList'
/integrations/installed-adapters/install-local:
  post:
    tags:
      - Integrations
    summary: 'Install or upsert a local adapter package; writes install config to YAML (data/adapter-install-config)'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InstallLocalAdapterRequest'
    responses:
      '201':
        description: 'Created or updated (enriched adapter row)'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAdapterPackageOne'
'/integrations/installed-adapters/{id}':
  parameters:
    -
      $ref: '#/components/parameters/InstalledAdapterIdPath'
  get:
    tags:
      - Integrations
    summary: 'Get one installed adapter (hydrated install from YAML or legacy DB)'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAdapterPackageOne'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
      - Integrations
    summary: 'Update install configuration YAML for this adapter (configJson, contextJson, outputProfiles, emitEnabled, ingestCanonicalEnabled, scheduleCron). At least one body field required. Does not store install blob in DB.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatchInstalledAdapterRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAdapterPackageOne'
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        description: 'Validation error'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorBody'
  delete:
    tags:
      - Integrations
    summary: 'Uninstall adapter — removes DB row and deletes YAML file data/adapter-install-config/{adapterKey}.install.yaml'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvelopeAdapterUninstall'
      '404':
        $ref: '#/components/responses/NotFound'
