    tags:
      - Integrations
    summary: 'Run the demo static adapter (poll, validate, encode, optional emit, adapter run log)'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              config:
                type: object
              context:
                type: object
                description: 'Merged with default parkSlug for encoders'
              profiles:
                type: array
                items:
                  type: string
                  enum:
                    - uns_json
                    - sparkplug_json
                    - canonical_historian
              emitMqtt:
                type: boolean
                default: false
              ingestCanonical:
                type: boolean
                default: false
              autoApply:
                type: boolean
                default: true
    responses:
      '200':
        description: OK
/integrations/adapters/run-local:
  post:
    tags:
      - Integrations
    summary: 'Run any local adapter package poll() pipeline (validate, encode, optional emit, run log)'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - adapterKey
              - context
            properties:
              adapterKey:
                type: string
                example: demo_static_adapter
              mode:
                type: string
                enum:
                  - poll
                default: poll
              config:
                type: object
              context:
                type: object
                description: 'At least one of parkSlug or sparkplugGroupId (non-empty). For UNS_JSON topics, sparkplugGroupId wins when set so TPUNS paths match Sparkplug group / UNS Live filter.'
                properties:
                  parkSlug:
                    type: string
                    example: europa_park
                  sparkplugGroupId:
                    type: string
                    example: europa_park
                  sparkplugEdgeNode:
                    type: string
                    example: weather_gateway
              profiles:
                type: array
                description: 'UNS_JSON / uns_json aliases accepted'
                items:
                  type: string
                  enum:
                    - uns_json
                    - sparkplug_json
                    - canonical_historian
                    - UNS_JSON
                    - SPARKPLUG_JSON
                    - CANONICAL_HISTORIAN
              emit:
                type: boolean
                default: false
                description: 'If true'
                MQTT: 'publish + canonical ingest'
              emitMqtt:
                type: boolean
                description: 'When sent together with optional ingestCanonical, overrides `emit` for MQTT only (e.g. weather UNS without canonical).'
              ingestCanonical:
                type: boolean
                description: 'When sent with emitMqtt (or alone), overrides `emit` for canonical ingest only.'
              autoApply:
                type: boolean
                default: true
    responses:
      '200':
        description: OK
/integrations/adapters/discover-local:
  post:
    tags:
      - Integrations
    summary: 'Run local adapter discover() (no observation encode/emit)'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - adapterKey
            properties:
              adapterKey:
                type: string
                example: demo_static_adapter
              config:
