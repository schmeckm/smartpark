components:
  schemas:
    MqttStatus:
      type: object
      properties:
        enabled:
          type: boolean
        connected:
          type: boolean
        lastError:
          type: string
          nullable: true
        broker:
          type: string
          nullable: true
        clientId:
          type: string
        topics:
          type: array
          items:
            type: string
    WeatherCreate:
      type: object
      required:
        - condition
      properties:
        condition:
          type: string
        temperatureC:
          type: number
          nullable: true
        rainMm:
          type: number
          nullable: true
        windKmh:
          type: number
          nullable: true
        source:
          type: string
        parkId:
          type: string
        observedAt:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time
    ErrorBody:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
        requestId:
          type: string
        details: {}
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            service:
              type: string
            timestamp:
              type: string
              format: date-time
            version:
              type: string
              description: 'Semver from root package.json'
            apiVersion:
              type: string
              example: v1
              description: 'URL-mounted API generation'
            gitCommit:
              type: string
              nullable: true
              description: 'Present when GIT_COMMIT or SOURCE_COMMIT is set at runtime'
    HealthDbResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            database:
              type: string
            latencyMs:
              type: integer
    HealthReadyResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            database:
              type: string
              example: connected
            latencyMs:
              type: integer
            version:
              type: string
            apiVersion:
              type: string
    HealthReadyFailureResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          properties:
            status:
              type: string
              example: not_ready
            database:
              type: string
              example: unavailable
            version:
              type: string
            apiVersion:
              type: string
    EnvelopeGenericData:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
    UserSettingsPatchBody:
      type: object
      description: 'Partial user settings; at least one field required (see `patchMyUserSettingsSchema`).'
      minProperties: 1
      properties:
        languageCode:
          type: string
          enum:
            - en
            - de
            - fr
            - es
        displayName:
          type: string
          maxLength: 255
          nullable: true
        timezone:
          type: string
          maxLength: 64
          nullable: true
          description: 'IANA time zone'
        dateFormat:
          type: string
          enum:
            - DD.MM.YYYY
            - YYYY-MM-DD
            - MM/DD/YYYY
        timeFormat:
          type: string
          enum:
            - 24h
            - 12h
        locale:
          type: string
          enum:
            - de-DE
            - en-US
            - fr-FR
            - es-ES
          nullable: true
        uiPreferences:
          type: object
          additionalProperties: true
          description: 'e.g. nested `parkMapFreqThresholds`'
    StaffImportItem:
      type: object
      required:
        - firstName
        - lastName
        - role
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
          maxLength: 64
          nullable: true
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        role:
          type: string
          enum:
            - FOOD_SERVICE
            - RIDE_OPERATOR
            - CLEANING
            - SECURITY
            - GUEST_SERVICE
        currentZoneId:
          type: string
          format: uuid
          nullable: true
        supervisorId:
          type: string
          format: uuid
          nullable: true
        available:
          type: boolean
        skillLevel:
          type: integer
          minimum: 1
          maximum: 5
      additionalProperties: true
    StaffImportBundle:
      type: object
      required:
        - items
      properties:
        schemaVersion:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffImportItem'
    StaffExportBundle:
      type: object
      properties:
        schemaVersion:
          type: integer
          example: 1
        entityType:
          type: string
          example: staff
        generatedAt:
          type: string
          format: date-time
        totalExported:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    EnvelopeStaffExportBundle:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/StaffExportBundle'
    StaffImportFailedRow:
      type: object
      properties:
        id:
          type: string
        error:
          type: string
        code:
          type: string
    StaffImportResult:
      type: object
      properties:
        entityType:
          type: string
          example: staff
        appliedCount:
          type: integer
        appliedIds:
          type: array
          items:
            type: string
            format: uuid
        failedCount:
          type: integer
        failed:
          type: array
          items:
            $ref: '#/components/schemas/StaffImportFailedRow'
    EnvelopeStaffImportResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/StaffImportResult'
    GeoPressureSimulateBody:
      type: object
      description: 'Optional map of asset key → `{ waitMin?, downtime? }` overrides.'
      properties:
        overrides:
          type: object
          additionalProperties:
            type: object
            properties:
              waitMin:
                type: number
                minimum: 0
                maximum: 400
              downtime:
                type: boolean
    GeoFlowEventItem:
      type: object
      required:
        - caseId
        - assetId
        - occurredAt
      properties:
        caseId:
          type: string
          minLength: 1
          maxLength: 160
        assetId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        eventType:
          type: string
          maxLength: 40
        source:
          type: string
          maxLength: 64
        payload:
          type: object
          additionalProperties: true
    GeoFlowEventsBatchBody:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/GeoFlowEventItem'
    GeoFlowBatchAppendResult:
      type: object
      properties:
        inserted:
          type: integer
          minimum: 0
    EnvelopeGeoFlowBatchAppend:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/GeoFlowBatchAppendResult'
    EnvelopeGeoPressurePayload:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: 'Pressure engine payload (park'
          'layers,': 'metrics — shape varies by mode)'
    EnvelopeGeoEntities:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
    EnvelopeGeoHotspots:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: 'Subset of live pressure including `hotspots` slice'
    EnvelopeGeoFlowSimulation:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: 'Flow graph / simulation DTO from `GeoFlowSimulatorService`'
    AttractionOeeCandidateRow:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        parkId:
          type: string
          format: uuid
        rideMaster:
          type: object
          additionalProperties: true
    EnvelopeAttractionOeeCandidates:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttractionOeeCandidateRow'
    AttractionOeeStartBody:
      type: object
      properties:
        parkSlug:
          type: string
          maxLength: 128
        parkId:
          type: string
          format: uuid
        edgeNodeId:
          type: string
          maxLength: 120
          nullable: true
        publishMs:
          type: integer
          minimum: 500
          maximum: 120000
        scenario:
          type: string
          description: 'One of `AttractionOeeScenarioName`'
        randomSeed:
          type: integer
          minimum: 0
          maximum: 4294967295
        attractions:
          oneOf:
            -
              type: array
              items:
                type: string
                maxLength: 160
            -
              type: string
              maxLength: 2000
        assetIds:
          type: array
          maxItems: 32
          items:
            type: string
            format: uuid
    AttractionOeeScenarioName:
      type: string
      enum:
        - NORMAL_OPERATION
        - HIGH_DEMAND
        - LOW_STAFF
        - TRAIN_REMOVED
        - TECHNICAL_STOP
        - WEATHER_DELAY
        - SLOW_LOADING
        - FAST_DISPATCH
        - PARK_OPENING
        - PARK_CLOSING
        - NIGHT_MODE
    AttractionOeeScenarioBody:
      type: object
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/AttractionOeeScenarioName'
    EnvelopeAttractionOeeStartResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: '`{ ok, config?, error?, alreadyRunning? }` from simulator start'
    RideEnrichTemplateBody:
      type: object
      properties:
        templateCode:
          type: string
          maxLength: 64
          default: RIDE_DEFAULT
          description: 'When omitted, server defaults to `RIDE_DEFAULT` (see `enrichTemplateBody` validator).'
    DowntimeReasonParetoRow:
      type: object
      properties:
        reasonCode:
          type: string
        durationMs:
          type: integer
        durationMinutes:
          type: integer
        sharePct:
          type: number
        cumulativeSharePct:
          type: number
        labelDe:
          type: string
    DowntimeReasonParetoData:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        window:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        plannedScope:
          type: string
          enum:
            - all
            - planned
            - unplanned
        totalDowntimeMinutes:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DowntimeReasonParetoRow'
    EnvelopeDowntimeReasonPareto:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/DowntimeReasonParetoData'
    EnvelopePlatformAssetEnrich:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PlatformAsset'
        meta:
          type: object
          additionalProperties: true
          description: 'Template merge diagnostics from `enrichRideFromTemplate`'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    AuthTokensResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: string
            user:
              $ref: '#/components/schemas/UserPublic'
    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - OPERATIONS_MANAGER
            - SECURITY_MANAGER
            - OPERATOR
            - VIEWER
        active:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Zone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        currentCrowdLevel:
          type: integer
        forecastCrowdLevel:
          type: integer
        maxCapacity:
          type: integer
        status:
          type: string
          enum:
            - ACTIVE
            - LIMITED
            - CLOSED
            - EVACUATION
        adjacentZoneIds:
          type: array
          items:
            type: string
            format: uuid
        rides:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        staffMembers:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
    ZoneCreate:
      type: object
      required:
        - name
        - type
        - maxCapacity
      properties:
        name:
          type: string
        type:
          type: string
        currentCrowdLevel:
          type: integer
        forecastCrowdLevel:
          type: integer
        maxCapacity:
          type: integer
        status:
          type: string
          enum:
            - ACTIVE
            - LIMITED
            - CLOSED
            - EVACUATION
        adjacentZoneIds:
          type: array
          items:
            type: string
            format: uuid
    ZoneUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        currentCrowdLevel:
          type: integer
        forecastCrowdLevel:
          type: integer
        maxCapacity:
          type: integer
        status:
          type: string
          enum:
            - ACTIVE
            - LIMITED
            - CLOSED
            - EVACUATION
        adjacentZoneIds:
          type: array
          items:
            type: string
            format: uuid
    Ride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        zoneId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
            - MAINTENANCE
        waitTime:
          type: integer
        capacityPerHour:
          type: integer
        criticality:
          type: integer
    RideCreate:
      type: object
      required:
        - name
        - zoneId
      properties:
        name:
          type: string
        zoneId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
            - MAINTENANCE
        waitTime:
          type: integer
        capacityPerHour:
          type: integer
        criticality:
          type: integer
    RideUpdate:
      type: object
      properties:
        name:
          type: string
        zoneId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
            - MAINTENANCE
        waitTime:
          type: integer
        capacityPerHour:
          type: integer
        criticality:
          type: integer
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - FOOD_SERVICE
            - RIDE_OPERATOR
            - CLEANING
            - SECURITY
            - GUEST_SERVICE
        currentZoneId:
          type: string
          format: uuid
          nullable: true
        available:
          type: boolean
        skillLevel:
          type: integer
    StaffCreate:
      type: object
      required:
        - firstName
        - lastName
        - role
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - FOOD_SERVICE
            - RIDE_OPERATOR
            - CLEANING
            - SECURITY
            - GUEST_SERVICE
        currentZoneId:
          type: string
          format: uuid
        available:
          type: boolean
        skillLevel:
          type: integer
    StaffUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - FOOD_SERVICE
            - RIDE_OPERATOR
            - CLEANING
            - SECURITY
            - GUEST_SERVICE
        currentZoneId:
          type: string
          format: uuid
          nullable: true
        available:
          type: boolean
        skillLevel:
          type: integer
    CrowdEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - CROWD_SPIKE
            - CROWD_DROP
            - RIDE_CLOSURE
            - WEATHER_IMPACT
        crowdLevel:
          type: integer
        severity:
          type: integer
        source:
          type: string
        createdAt:
          type: string
          format: date-time
    CrowdEventCreate:
      type: object
      required:
        - zoneId
        - eventType
        - crowdLevel
      properties:
        zoneId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - CROWD_SPIKE
            - CROWD_DROP
            - RIDE_CLOSURE
            - WEATHER_IMPACT
        crowdLevel:
          type: integer
        severity:
          type: integer
        source:
          type: string
        syncZone:
          type: boolean
          default: true
        weatherCondition:
          type: string
          description: 'For WEATHER_IMPACT'
    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        recommendationType:
          type: string
          enum:
            - REALLOCATE_STAFF
            - OPEN_SERVICE_POINT
            - SEND_SECURITY
            - CLEANING_SUPPORT
            - GUEST_ROUTING
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        message:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - ACCEPTED
            - REJECTED
            - COMPLETED
    DashboardSummary:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        zones:
          type: object
          properties:
            total:
              type: integer
            nearCapacityCount:
              type: integer
        rides:
          type: object
          properties:
            total:
              type: integer
            open:
              type: integer
        staff:
          type: object
          properties:
            total:
              type: integer
            available:
              type: integer
        recommendations:
          type: object
          properties:
            open:
              type: integer
            openByPriority:
              type: object
              additionalProperties:
                type: integer
        events:
          type: object
          properties:
            last24Hours:
              type: integer
            recentSample:
              type: array
              items:
                $ref: '#/components/schemas/CrowdEvent'
    EnvelopeAiHealth:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
            sampling:
              type: object
              properties:
                enabled:
                  type: boolean
                intervalSeconds:
                  type: integer
            modelName:
              type: string
    EnvelopeAiRefresh:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            sampledZones:
              type: integer
            forecastsCreated:
              type: integer
            recommendationsScored:
              type: integer
              description: 'OPEN recommendations rescored after forecast'
            generatedAt:
              type: string
              format: date-time
    EnvelopeForecasts:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Forecast'
    Forecast:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          type: string
          enum:
            - PARK
            - ZONE
            - RIDE
        subjectId:
          type: string
          format: uuid
          nullable: true
        targetMetric:
          type: string
          enum:
            - CROWD_LEVEL
            - WAIT_TIME
            - STAFF_DEMAND
        horizonMinutes:
          type: integer
        predictedValue:
          type: number
        confidence:
          type: number
          nullable: true
        predictionBand:
          type: object
          nullable: true
        modelVersionId:
          type: string
          format: uuid
          nullable: true
        features:
          type: object
          nullable: true
        producedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        zoneName:
          type: string
          nullable: true
    EnvelopeAiInsights:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            topHotspotZones:
              type: array
              items:
                type: object
                properties:
                  zoneId:
                    type: string
                    format: uuid
                  zoneName:
                    type: string
                  maxCapacity:
                    type: integer
                  predictedCrowdLevel:
                    type: number
                  crowdRatio:
                    type: number
                  confidence:
                    type: number
                    nullable: true
            highestPredictedCrowdRatio:
              type: number
            forecastHorizonMinutes:
              type: integer
              example: 60
            averageConfidence:
              type: number
              nullable: true
            confidence:
              type: number
              nullable: true
              description: 'Alias of averageConfidence for top hotspot rows'
            generatedAt:
              type: string
              format: date-time
    MlFactorCurrentResolution:
      type: object
      description: "One dynamic L1 factor after mergeMlEnterpriseLayer. JSON responses strip internal `meta` (e.g. rain mm used for bump magnitude); clients must not expect `meta`.\n"
      properties:
        current:
          type: number
          description: 'Effective multiplier [0'
          '1.5]': 'after priority chain'
        currentSource:
          type: string
          description: 'API, CALCULATED, L1_CURRENT, L1_DEFAULT, or L2_* (park row override)'
        calculatedCurrent:
          type: number
          nullable: true
        manualCurrentOverride:
          type: number
          nullable: true
        l1ApiCurrent:
          type: number
          nullable: true
    ParkForecastSummary:
      type: object
      additionalProperties: true
      description: 'AI park/entity forecast summary (`data` in envelope). Fields are additive across versions.'
      properties:
        externalParkId:
          type: string
        externalEntityId:
          type: string
          nullable: true
        provider:
          type: string
        asOf:
          type: string
          nullable: true
          format: date-time
        crowdLevelPercent:
          type: number
          nullable: true
        currentAvgWaitMinutes:
          type: number
          nullable: true
        forecast15Minutes:
          type: number
          nullable: true
        forecast60Minutes:
          type: number
          nullable: true
        trend:
          type: string
        confidence:
          type: number
        forecastSource:
          type: string
          nullable: true
        topInfluencingFactors:
          type: array
          items:
            type: object
            additionalProperties: true
        mlFactorCurrents:
          type: object
          description: 'Map factor_code → resolution; always present (may be empty object)'
          additionalProperties:
            $ref: '#/components/schemas/MlFactorCurrentResolution'
        factors:
          type: array
          items:
            type: object
            additionalProperties: true
        model:
