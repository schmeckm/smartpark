  '/ml/predict/rides/{rideId}':
    get:
      tags:
        - AI
      summary: 'Predict ride wait times (15/30/60 min) from feature store + optional ridge models'
      deprecated: true
      description: "**Deprecated (Phase B5)** — every other AI endpoint lives under `/ai/*`. Use the canonical\n`GET /ai/ml/predict/rides/{rideId}` instead. Same handler, same RBAC (`ai.read`),\nsame `X-Park-Id` requirement, same response shape; the `/ml/*` mount remains live for\nbackwards compatibility (admin-dashboard still calls it) and will be removed in a\nfuture major version.\n"
      parameters:
        -
          in: path
          name: rideId
          required: true
          schema:
            type: string
            format: uuid
          description: 'Platform ride asset_id (park_assets.asset_id)'
        -
          in: query
          name: horizon
          schema:
            type: string
            example: 1530
          description: 'Comma-separated horizons in minutes'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeMlRidePredict'
  /ml/predict/park-summary:
    get:
      tags:
        - AI
      summary: 'Add-on Board L0/L1 — aggregate 60m wait forecasts across ride assets'
      deprecated: true
      description: "**Deprecated (Phase B5)** — use `GET /ai/ml/predict/park-summary`. Same handler, same RBAC.\nLoads RIDE-type `park_assets`, calls the same prediction path as L3 per ride (batched),\nthen rolls up `parkDemandForecastIndex`, `averageForecastWaitTime60`, `forecastCriticalRides`,\nand per-zone stats for L1 drill-down. Optional `zoneId` scopes the asset list to one zone.\nResponses are cached about **45 seconds** per `(park, zone, threshold, limit, offset)` key.\n"
      parameters:
        -
          in: query
          name: zoneId
          schema:
            type: string
            format: uuid
          description: 'When set, only rides in this zone are included (L1 scope).'
        -
          in: query
          name: criticalAtMinutes
          schema:
            type: number
            minimum: 15
            maximum: 180
            default: 55
          description: 'Count rides at or above this forecasted wait (60 min horizon) as critical.'
        -
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 80
          description: 'Max ride assets to evaluate (caps load).'
        -
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 500
            default: 0
          description: 'Skip this many ride assets (stable name order) for paging large parks.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeMlParkForecastSummary'
