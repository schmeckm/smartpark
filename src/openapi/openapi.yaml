    SignalRuntimePreview:
      type: object
      description: "Unified read-only signal preview (consolidation phase). Normalized metadata + eligibility + `status` + optional\n`latestValue` from the same persistence layers as Phase I (`uns_latest_states`, canonical inbound, ride feature snapshot).\nAdditive on Add-on Board APIs; not a KPI engine, not ML training routing, not browser MQTT.\n"
      required:
        - signalKey
        - domain
        - metric
        - eligibility
        - status
        - latestValue
      properties:
        signalKey:
          type: string
        domain:
          type: string
        metric:
          type: string
        entityType:
          type: string
          description: 'Resolver input echo (e.g. `park_asset`).'
        entityId:
          type: string
          format: uuid
        eligibility:
          type: object
          required:
            - enabled
            - boardEligible
            - mlEligible
          properties:
            enabled:
              type: boolean
            boardEligible:
              type: boolean
            mlEligible:
              type: boolean
        status:
          type: string
          enum:
            - valid
            - disabled
            - missing_signal
            - not_board_eligible
            - not_ml_eligible
            - entity_mismatch
            - no_live_value
        latestValue:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/AddonBoardWidgetSourceLatestValue'
    AddonBoardWidgetSourceLatestValue:
      type: object
      required:
        - value
        - unit
        - ts
        - quality
        - source
      description: "Read-only live scalar preview for a valid widget source draft (Phase I). Not used for Add-on Board KPI computation.\n"
      properties:
        value:
          nullable: true
          description: 'Latest known value (number, string, boolean, or JSON-serializable object).'
        unit:
          type: string
          nullable: true
        ts:
          type: string
          format: date-time
          description: 'Event or observation time for the chosen source layer.'
        quality:
          type: string
          description: 'Data quality hint (e.g. GOOD, ESTIMATED).'
        source:
          type: string
          description: "Resolution layer, e.g. `uns_live_state` (from `uns_latest_states`), `canonical_inbound`, `ride_feature_snapshot`.\n"
    AddonBoardWidgetSourcePreview:
      type: object
      required:
        - draft
        - resolved
        - latestValue
      properties:
        draft:
          $ref: '#/components/schemas/AddonBoardWidgetSourceDraft'
        resolved:
          $ref: '#/components/schemas/AddonBoardWidgetSourceResolved'
        latestValue:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/AddonBoardWidgetSourceLatestValue'
          description: "Present only when `resolved.valid` is true; `null` when no matching persisted value. When `resolved.valid`\nis false, the field is `null` and no live lookup is performed.\n"
        signalPreview:
          allOf:
            -
              $ref: '#/components/schemas/SignalRuntimePreview'
          description: "Optional normalized preview (`status`, `eligibility`, echo fields). Same latest-value chain as `latestValue`;\nclients may ignore this field; `resolved` / `latestValue` remain the stable contract.\n"
