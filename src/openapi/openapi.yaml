    AddonBoardWidgetSourceDraft:
      type: object
      required: [sourceType, entityType, entityId, signalKey]
      properties:
        sourceType:
          type: string
          enum: [SIGNAL_METADATA]
        entityType:
          type: string
          enum: [park_asset]
        entityId: { type: string, format: uuid }
        signalKey:
          type: string
          description: 'Must match `domain.metric` with a supported domain; must be enabled and board-eligible on the asset.'

    AddonBoardWidgetSourceResolved:
      type: object
      required: [valid, domain, metric, enabled, boardEligible]
      properties:
        valid:
          type: boolean
          description: True when current extensions still mark the signal enabled and board-eligible.
        domain: { type: string }
        metric: { type: string }
        enabled: { type: boolean }
        boardEligible: { type: boolean }

    SignalRuntimePreview:
      type: object
      description: |
        Unified read-only signal preview (consolidation phase). Normalized metadata + eligibility + `status` + optional
        `latestValue` from the same persistence layers as Phase I (`uns_latest_states`, canonical inbound, ride feature snapshot).
        Additive on Add-on Board APIs; not a KPI engine, not ML training routing, not browser MQTT.
      required: [signalKey, domain, metric, eligibility, status, latestValue]
      properties:
        signalKey: { type: string }
        domain: { type: string }
        metric: { type: string }
        entityType: { type: string, description: Resolver input echo (e.g. `park_asset`). }
        entityId: { type: string, format: uuid }
        eligibility:
          type: object
          required: [enabled, boardEligible, mlEligible]
          properties:
            enabled: { type: boolean }
            boardEligible: { type: boolean }
            mlEligible: { type: boolean }
        status:
          type: string
          enum:
            - valid
            - disabled
            - missing_signal
            - not_board_eligible
            - not_ml_eligible
            - entity_mismatch
            - no_live_value
        latestValue:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AddonBoardWidgetSourceLatestValue'

    AddonBoardWidgetSourceLatestValue:
      type: object
      required: [value, unit, ts, quality, source]
      description: |
        Read-only live scalar preview for a valid widget source draft (Phase I). Not used for Add-on Board KPI computation.
      properties:
        value:
          nullable: true
          description: Latest known value (number, string, boolean, or JSON-serializable object).
        unit:
          type: string
          nullable: true
        ts:
          type: string
          format: date-time
          description: Event or observation time for the chosen source layer.
        quality:
          type: string
          description: Data quality hint (e.g. GOOD, ESTIMATED).
        source:
          type: string
          description: |
            Resolution layer, e.g. `uns_live_state` (from `uns_latest_states`), `canonical_inbound`, `ride_feature_snapshot`.

    AddonBoardWidgetSourcePreview:
      type: object
      required: [draft, resolved, latestValue]
      properties:
        draft:
          $ref: '#/components/schemas/AddonBoardWidgetSourceDraft'
        resolved:
          $ref: '#/components/schemas/AddonBoardWidgetSourceResolved'
        latestValue:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AddonBoardWidgetSourceLatestValue'
          description: |
            Present only when `resolved.valid` is true; `null` when no matching persisted value. When `resolved.valid`
            is false, the field is `null` and no live lookup is performed.
        signalPreview:
          allOf:
            - $ref: '#/components/schemas/SignalRuntimePreview'
          description: |
            Optional normalized preview (`status`, `eligibility`, echo fields). Same latest-value chain as `latestValue`;
            clients may ignore this field; `resolved` / `latestValue` remain the stable contract.

    EnvelopeAddonBoardWidgetSourceDraft:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/AddonBoardWidgetSourceDraft'

    EnvelopeAddonBoardWidgetSourceDraftNullable:
      type: object
      properties:
        success: { type: boolean }
        data:
          nullable: true
          description: Null when no draft; otherwise draft plus resolved preview for L3 UI.
          allOf:
            - $ref: '#/components/schemas/AddonBoardWidgetSourcePreview'

    AddonBoardRideCustomWidgetSource:
      type: object
      required: [sourceType, entityType, entityId, signalKey]
      properties:
        sourceType:
          type: string
          enum: [SIGNAL_METADATA]
        entityType:
          type: string
          enum: [park_asset]
        entityId: { type: string, format: uuid }
        signalKey: { type: string }

    AddonBoardRideCustomWidgetDisplay:
      type: object
      required: [type, unitMode, refreshMode]
      properties:
        type:
          type: string
          enum: [latest_value]
        unitMode:
          type: string
          enum: [fromSource]
        refreshMode:
          type: string
          enum: [manual_or_existing_board_refresh]

    AddonBoardCustomWidgetPatch:
      type: object
      description: At least one property required. `source` / `display` are not accepted in this phase.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean

    AddonBoardRideCustomWidget:
      type: object
      required: [widgetId, title, source, display, enabled]
      properties:
        widgetId:
          type: string
          description: Stable id derived from signal key (e.g. `signal_queue_wait_time_min`).
        title: { type: string }
        source:
          $ref: '#/components/schemas/AddonBoardRideCustomWidgetSource'
        display:
          $ref: '#/components/schemas/AddonBoardRideCustomWidgetDisplay'
        enabled: { type: boolean }
        resolved:
          nullable: true
          description: |
            Phase K — set when the widget is enabled, `SIGNAL_METADATA`, and `display.type` is `latest_value`;
            otherwise `null`. Reflects **current** extensions vs `source.signalKey` (same as draft preview).
          allOf:
            - $ref: '#/components/schemas/AddonBoardWidgetSourceResolved'
        latestValue:
          nullable: true
          description: |
            Phase K — read-only scalar when `resolved.valid` is true; `null` when invalid, no row, or lookup failure.
          allOf:
            - $ref: '#/components/schemas/AddonBoardWidgetSourceLatestValue'
        sourceEntityMismatch:
          type: boolean
          description: True when persisted `source.entityId` ≠ path `rideId` (no live lookup).
        health:
          type: string
          enum: [ok, invalid_source, disabled, no_live_value, entity_mismatch]
          description: |
            Phase M — derived from `enabled`, `sourceEntityMismatch`, `resolved.valid`, and `latestValue` presence;
            no additional persistence or KPI logic.
        signalPreview:
          allOf:
            - $ref: '#/components/schemas/SignalRuntimePreview'
          description: Optional normalized preview for the widget source signal (additive; UI may ignore).

    EnvelopeAddonBoardCustomWidgets:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [widgets]
          properties:
            widgets:
              type: array
              items:
                $ref: '#/components/schemas/AddonBoardRideCustomWidget'

    EnvelopeAddonBoardPromotedWidget:
      type: object
      description: |
        Used for **POST** `.../widgets/from-source-draft` (**201**) and **PATCH** `.../custom-widgets/:widgetId` (**200**).
        **POST** returns a **base** widget only (required fields of `AddonBoardRideCustomWidget`). **PATCH** returns the same
        schema with optional preview fields populated like **GET** `.../custom-widgets` (including optional **`signalPreview`**).
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [widget]
          properties:
            widget:
              allOf:
                - $ref: '#/components/schemas/AddonBoardRideCustomWidget'
              description: |
                **POST promote:** base persisted widget (`widgetId`, `title`, `source`, `display`, `enabled`) — omit `resolved`, `latestValue`, `health`, `signalPreview`.
                **PATCH:** enriched row; optional `signalPreview` when preview applies.

    OperationsFactMetric:
      type: object
      description: |
        Normalized KPI cell. `status` is a traffic-light style hint (GREEN/YELLOW/RED/UNKNOWN) for UI rings;
        `quality` describes data confidence (GOOD, ESTIMATED, MISSING). `source` identifies the winning input
        after priority rules (see architecture doc).
      properties:
        value: { nullable: true, description: 'Resolved KPI value or null when unavailable' }
        unit: { type: string, nullable: true }
        status:
          type: string
          enum: ['GREEN', 'YELLOW', 'RED', 'UNKNOWN']
          description: Traffic-light hint; may vary by KPI type.
        quality:
          type: string
          enum: ['GOOD', 'ESTIMATED', 'MISSING']
        source: { type: string, description: 'e.g. MQTT_LIVE_STATE, RIDE_FEATURE_SNAPSHOT, CANONICAL_WAIT_TIME_UPDATED' }
        updatedAt: { type: string, format: date-time, nullable: true }

