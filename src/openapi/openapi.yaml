components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstalledAdapterIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Adapter package UUID or adapterKey (slug)

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    MqttStatus:
      type: object
      properties:
        enabled: { type: boolean }
        connected: { type: boolean }
        lastError: { type: string, nullable: true }
        broker: { type: string, nullable: true }
        clientId: { type: string }
        topics: { type: array, items: { type: string } }
    WeatherCreate:
      type: object
      required: [condition]
      properties:
        condition: { type: string }
        temperatureC: { type: number, nullable: true }
        rainMm: { type: number, nullable: true }
        windKmh: { type: number, nullable: true }
        source: { type: string }
        parkId: { type: string }
        observedAt: { type: string, format: date-time }
        timestamp: { type: string, format: date-time }
    ErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code: { type: string }
        requestId: { type: string }
        details: {}
    HealthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            status: { type: string }
            service: { type: string }
            timestamp: { type: string, format: date-time }
            version: { type: string, description: Semver from root package.json }
            apiVersion: { type: string, example: v1, description: URL-mounted API generation }
            gitCommit:
              { type: string, nullable: true, description: Present when GIT_COMMIT or SOURCE_COMMIT is set at runtime }
    HealthDbResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            status: { type: string }
            database: { type: string }
            latencyMs: { type: integer }
    HealthReadyResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            status: { type: string, example: ready }
            database: { type: string, example: connected }
            latencyMs: { type: integer }
            version: { type: string }
            apiVersion: { type: string }
    HealthReadyFailureResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        data:
          type: object
          properties:
            status: { type: string, example: not_ready }
            database: { type: string, example: unavailable }
            version: { type: string }
            apiVersion: { type: string }
    EnvelopeGenericData:
      type: object
      properties:
        success: { type: boolean }
        data: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string }
    AuthTokensResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            expiresIn: { type: string }
            user:
              $ref: '#/components/schemas/UserPublic'
    UserPublic:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [ADMIN, OPERATIONS_MANAGER, SECURITY_MANAGER, OPERATOR, VIEWER]
        active: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Zone:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        currentCrowdLevel: { type: integer }
        forecastCrowdLevel: { type: integer }
        maxCapacity: { type: integer }
        status:
          type: string
          enum: [ACTIVE, LIMITED, CLOSED, EVACUATION]
        adjacentZoneIds:
          type: array
          items: { type: string, format: uuid }
        rides:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        staffMembers:
          type: array
          items:
            $ref: '#/components/schemas/Staff'

    ZoneCreate:
      type: object
      required: [name, type, maxCapacity]
      properties:
        name: { type: string }
        type: { type: string }
        currentCrowdLevel: { type: integer }
        forecastCrowdLevel: { type: integer }
        maxCapacity: { type: integer }
        status:
          type: string
          enum: [ACTIVE, LIMITED, CLOSED, EVACUATION]
        adjacentZoneIds:
          type: array
          items: { type: string, format: uuid }

    ZoneUpdate:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        currentCrowdLevel: { type: integer }
        forecastCrowdLevel: { type: integer }
        maxCapacity: { type: integer }
        status:
          type: string
          enum: [ACTIVE, LIMITED, CLOSED, EVACUATION]
        adjacentZoneIds:
          type: array
          items: { type: string, format: uuid }

    Ride:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        zoneId: { type: string, format: uuid }
        status:
          type: string
          enum: [OPEN, CLOSED, MAINTENANCE]
        waitTime: { type: integer }
        capacityPerHour: { type: integer }
        criticality: { type: integer }

    RideCreate:
      type: object
      required: [name, zoneId]
      properties:
        name: { type: string }
        zoneId: { type: string, format: uuid }
        status:
          type: string
          enum: [OPEN, CLOSED, MAINTENANCE]
        waitTime: { type: integer }
        capacityPerHour: { type: integer }
        criticality: { type: integer }

    RideUpdate:
      type: object
      properties:
        name: { type: string }
        zoneId: { type: string, format: uuid }
        status:
          type: string
          enum: [OPEN, CLOSED, MAINTENANCE]
        waitTime: { type: integer }
        capacityPerHour: { type: integer }
        criticality: { type: integer }

    Staff:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [FOOD_SERVICE, RIDE_OPERATOR, CLEANING, SECURITY, GUEST_SERVICE]
        currentZoneId: { type: string, format: uuid, nullable: true }
        available: { type: boolean }
        skillLevel: { type: integer }

    StaffCreate:
      type: object
      required: [firstName, lastName, role]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [FOOD_SERVICE, RIDE_OPERATOR, CLEANING, SECURITY, GUEST_SERVICE]
        currentZoneId: { type: string, format: uuid }
        available: { type: boolean }
        skillLevel: { type: integer }

    StaffUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [FOOD_SERVICE, RIDE_OPERATOR, CLEANING, SECURITY, GUEST_SERVICE]
        currentZoneId: { type: string, format: uuid, nullable: true }
        available: { type: boolean }
        skillLevel: { type: integer }

    CrowdEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [CROWD_SPIKE, CROWD_DROP, RIDE_CLOSURE, WEATHER_IMPACT]
        crowdLevel: { type: integer }
        severity: { type: integer }
        source: { type: string }
        createdAt: { type: string, format: date-time }

    CrowdEventCreate:
      type: object
      required: [zoneId, eventType, crowdLevel]
      properties:
        zoneId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [CROWD_SPIKE, CROWD_DROP, RIDE_CLOSURE, WEATHER_IMPACT]
        crowdLevel: { type: integer }
        severity: { type: integer }
        source: { type: string }
        syncZone: { type: boolean, default: true }
        weatherCondition: { type: string, description: 'For WEATHER_IMPACT' }

    Recommendation:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        recommendationType:
          type: string
          enum:
            - REALLOCATE_STAFF
            - OPEN_SERVICE_POINT
            - SEND_SECURITY
            - CLEANING_SUPPORT
            - GUEST_ROUTING
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        message: { type: string }
        status:
          type: string
          enum: [OPEN, ACCEPTED, REJECTED, COMPLETED]

    DashboardSummary:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        zones:
          type: object
          properties:
            total: { type: integer }
            nearCapacityCount: { type: integer }
        rides:
          type: object
          properties:
            total: { type: integer }
            open: { type: integer }
        staff:
          type: object
          properties:
            total: { type: integer }
            available: { type: integer }
        recommendations:
          type: object
          properties:
            open: { type: integer }
            openByPriority:
              type: object
              additionalProperties: { type: integer }
        events:
          type: object
          properties:
            last24Hours: { type: integer }
            recentSample:
              type: array
              items:
                $ref: '#/components/schemas/CrowdEvent'

    EnvelopeAiHealth:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            sampling:
              type: object
              properties:
                enabled: { type: boolean }
                intervalSeconds: { type: integer }
            modelName: { type: string }

    EnvelopeAiRefresh:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            sampledZones: { type: integer }
            forecastsCreated: { type: integer }
            recommendationsScored: { type: integer, description: OPEN recommendations rescored after forecast }
            generatedAt: { type: string, format: date-time }

    EnvelopeForecasts:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/Forecast' }

    Forecast:
      type: object
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [PARK, ZONE, RIDE] }
        subjectId: { type: string, format: uuid, nullable: true }
        targetMetric: { type: string, enum: [CROWD_LEVEL, WAIT_TIME, STAFF_DEMAND] }
        horizonMinutes: { type: integer }
        predictedValue: { type: number }
        confidence: { type: number, nullable: true }
        predictionBand: { type: object, nullable: true }
        modelVersionId: { type: string, format: uuid, nullable: true }
        features: { type: object, nullable: true }
        producedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        zoneName: { type: string, nullable: true }

    EnvelopeAiInsights:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            topHotspotZones:
              type: array
              items:
                type: object
                properties:
                  zoneId: { type: string, format: uuid }
                  zoneName: { type: string }
                  maxCapacity: { type: integer }
                  predictedCrowdLevel: { type: number }
                  crowdRatio: { type: number }
                  confidence: { type: number, nullable: true }
            highestPredictedCrowdRatio: { type: number }
            forecastHorizonMinutes: { type: integer, example: 60 }
            averageConfidence: { type: number, nullable: true }
            confidence: { type: number, nullable: true, description: "Alias of averageConfidence for top hotspot rows" }
            generatedAt: { type: string, format: date-time }

    MlFactorCurrentResolution:
      type: object
      description: >
        One dynamic L1 factor after mergeMlEnterpriseLayer. JSON responses strip internal `meta`
