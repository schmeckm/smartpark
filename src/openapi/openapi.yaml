      responses:
        '200':
          description: 'Proposal rejected'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUnsSpyMqttProposalRejectResult'
        '401':
          description: 'Missing or invalid JWT'
        '403':
          description: 'Missing integrations.manage and rides.update'
        '404':
          description: 'Proposal not found'
        '409':
          description: 'Proposal not pending'
        '422':
          description: 'Not an MQTT-linked proposal'
  '/uns-spy/events/{id}/approve':
    post:
      tags:
        - UNS
      summary: 'Approve an adapter-sourced discovery event (map to existing ride asset)'
      description: 'Requires **integrations.manage** OR **rides.update**. Phase 12: maps external entity to an existing `park_assets` ride row via `external_entity_mappings`, updates event `details.reviewStatus=APPROVED`, optionally applies ride template and prepares UNS registry topics (prepared/inactive only). Does **not** create `uns_nodes` and does **not** publish MQTT from this handler.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsSpyDiscoveryApproveRequest'
      responses:
        '200':
          description: 'Approval result (mapped entity, optional template/prepare summary)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUnsSpyDiscoveryApproveResult'
              examples:
                approved:
                  value:
                    success: true
                    data:
                      eventId: 00000000-0000-4000-8000-000000000010
                      mappedEntityId: 00000000-0000-4000-8000-000000000020
                      templateApplied: false
                      preparedUnsTopics:
                        created: 0
                        updated: 0
        '401':
          description: 'Missing or invalid JWT'
        '403':
          description: 'Missing integrations.manage and rides.update'
        '404':
          description: 'Discovery event or target ride asset not found'
        '409':
          description: 'Event already approved (code `ALREADY_APPROVED`)'
          content:
            application/json:
              examples:
                alreadyApproved:
                  value:
                    success: false
                    message: 'Event already approved'
                    code: ALREADY_APPROVED
        '422':
          description: 'Validation error, not an adapter event (`NOT_ADAPTER_EVENT`), or unsupported body (`createEntity` not supported)'
          content:
            application/json:
              examples:
                notAdapter:
                  value:
                    success: false
                    message: 'Discovery event is not adapter-sourced'
                    code: NOT_ADAPTER_EVENT
                joiMissingMap:
                  value:
                    success: false
                    message: 'Validation failed'
                    code: VALIDATION_ERROR
  '/uns-spy/events/{id}/reject':
    post:
      tags:
        - UNS
      summary: 'Reject an adapter-sourced discovery event'
      description: 'Requires **integrations.manage** OR **rides.update**. Sets `details.reviewStatus=REJECTED`.'
      security:
        -
          bearerAuth: []
      parameters:
