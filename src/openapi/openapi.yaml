    AddonBoardCustomWidgetPatch:
      type: object
      description: 'At least one property required. `source` / `display` are not accepted in this phase.'
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean
    AddonBoardRideCustomWidget:
      type: object
      required:
        - widgetId
        - title
        - source
        - display
        - enabled
      properties:
        widgetId:
          type: string
          description: 'Stable id derived from signal key (e.g. `signal_queue_wait_time_min`).'
        title:
          type: string
        source:
          $ref: '#/components/schemas/AddonBoardRideCustomWidgetSource'
        display:
          $ref: '#/components/schemas/AddonBoardRideCustomWidgetDisplay'
        enabled:
          type: boolean
        resolved:
          nullable: true
          description: "Phase K — set when the widget is enabled, `SIGNAL_METADATA`, and `display.type` is `latest_value`;\notherwise `null`. Reflects **current** extensions vs `source.signalKey` (same as draft preview).\n"
          allOf:
            -
              $ref: '#/components/schemas/AddonBoardWidgetSourceResolved'
        latestValue:
          nullable: true
          description: "Phase K — read-only scalar when `resolved.valid` is true; `null` when invalid, no row, or lookup failure.\n"
          allOf:
            -
              $ref: '#/components/schemas/AddonBoardWidgetSourceLatestValue'
        sourceEntityMismatch:
          type: boolean
          description: 'True when persisted `source.entityId` ≠ path `rideId` (no live lookup).'
        health:
          type: string
          enum:
            - ok
            - invalid_source
            - disabled
            - no_live_value
            - entity_mismatch
          description: "Phase M — derived from `enabled`, `sourceEntityMismatch`, `resolved.valid`, and `latestValue` presence;\nno additional persistence or KPI logic.\n"
        signalPreview:
          allOf:
            -
              $ref: '#/components/schemas/SignalRuntimePreview'
          description: 'Optional normalized preview for the widget source signal (additive; UI may ignore).'
