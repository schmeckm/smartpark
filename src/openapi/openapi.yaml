                        type: array
                        description: Scan of manifest.json + entrypoint under integrations/adapter-packages
  /integrations/adapters/pipeline-log:
    get:
      tags: [Integrations]
      summary: Read recent adapter pipeline log (NDJSON tail on server; optional adapterKey filter)
      parameters:
        - in: query
          name: adapterKey
          schema: { type: string }
          description: Filter to one adapter key (omit for all adapters in tail window)
        - in: query
          name: limit
          schema: { type: integer, default: 200, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
  /integrations/adapters/packages/reload:
    post:
      tags: [Integrations]
      summary: Reload local adapter packages from filesystem
      responses: { '200': { description: OK } }
  /integrations/adapters/packages/{adapterKey}/health:
    post:
      tags: [Integrations]
      summary: Run adapter runtime health check
      parameters:
        - in: path
          name: adapterKey
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses: { '200': { description: OK } }

  /integrations/output/encode:
    post:
      tags: [Integrations]
      summary: Encode adapter observation for UNS JSON, Sparkplug JSON MVP, and/or canonical historian (no side effects)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observation, context]
              properties:
                observation: { type: object, description: Normalized observation (domain, assetSlug, metric, value, …) }
                context:
                  type: object
                  description: Non-empty parkSlug and/or sparkplugGroupId (UNS_JSON uses sparkplugGroupId first when set).
                  properties:
                    parkSlug: { type: string }
                    sparkplugGroupId: { type: string }
                profiles:
                  type: array
                  items: { type: string, enum: [uns_json, sparkplug_json, canonical_historian] }
      responses: { '200': { description: OK } }

  /integrations/output/emit:
    post:
      tags: [Integrations]
      summary: Encode and optionally publish MQTT and/or ingest canonical messages (integrations manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observation, context]
              properties:
                observation: { type: object }
                context: { type: object }
                profiles:
                  type: array
                  items: { type: string, enum: [uns_json, sparkplug_json, canonical_historian] }
                emitMqtt: { type: boolean, default: false }
                ingestCanonical: { type: boolean, default: false }
                autoApply: { type: boolean, default: true }
      responses: { '200': { description: OK } }

  /integrations/adapters/demo/run:
    post:
      tags: [Integrations]
      summary: Run the demo static adapter (poll, validate, encode, optional emit, adapter run log)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config: { type: object }
                context: { type: object, description: Merged with default parkSlug for encoders }
                profiles:
                  type: array
                  items: { type: string, enum: [uns_json, sparkplug_json, canonical_historian] }
                emitMqtt: { type: boolean, default: false }
                ingestCanonical: { type: boolean, default: false }
                autoApply: { type: boolean, default: true }
      responses: { '200': { description: OK } }

  /integrations/adapters/run-local:
    post:
      tags: [Integrations]
      summary: Run any local adapter package poll() pipeline (validate, encode, optional emit, run log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterKey, context]
              properties:
                adapterKey: { type: string, example: demo_static_adapter }
                mode: { type: string, enum: [poll], default: poll }
                config: { type: object }
                context:
                  type: object
                  description: >-
                    At least one of parkSlug or sparkplugGroupId (non-empty). For UNS_JSON topics, sparkplugGroupId
                    wins when set so TPUNS paths match Sparkplug group / UNS Live filter.
                  properties:
                    parkSlug: { type: string, example: europa_park }
                    sparkplugGroupId: { type: string, example: europa_park }
                    sparkplugEdgeNode: { type: string, example: weather_gateway }
                profiles:
                  type: array
                  description: UNS_JSON / uns_json aliases accepted
                  items:
                    type: string
                    enum:
                      [
                        uns_json,
                        sparkplug_json,
                        canonical_historian,
                        UNS_JSON,
                        SPARKPLUG_JSON,
                        CANONICAL_HISTORIAN,
                      ]
                emit: { type: boolean, default: false, description: If true, MQTT publish + canonical ingest }
                emitMqtt:
                  type: boolean
                  description: >-
                    When sent together with optional ingestCanonical, overrides `emit` for MQTT only (e.g. weather UNS without canonical).
                ingestCanonical:
                  type: boolean
                  description: When sent with emitMqtt (or alone), overrides `emit` for canonical ingest only.
                autoApply: { type: boolean, default: true }
      responses: { '200': { description: OK } }

  /integrations/adapters/discover-local:
    post:
      tags: [Integrations]
      summary: Run local adapter discover() (no observation encode/emit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterKey]
              properties:
                adapterKey: { type: string, example: demo_static_adapter }
                config: { type: object }
                context: { type: object }
      responses: { '200': { description: OK } }

  /integrations/adapters/health-local:
    post:
      tags: [Integrations]
      summary: Run local adapter health() (read; no encode/emit/run log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterKey]
              properties:
                adapterKey: { type: string, example: demo_static_adapter }
                config: { type: object }
                context: { type: object }
      responses: { '200': { description: OK } }

  /integrations/installed-adapters:
    get:
      tags: [Integrations]
      summary: List installed adapter packages (DB + scan); install config is hydrated from YAML per adapterKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeInstalledAdapterList'

  /integrations/installed-adapters/install-local:
    post:
      tags: [Integrations]
      summary: Install or upsert a local adapter package; writes install config to YAML (data/adapter-install-config)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallLocalAdapterRequest'
      responses:
        '201':
          description: Created or updated (enriched adapter row)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdapterPackageOne'

  /integrations/installed-adapters/{id}:
    parameters:
      - $ref: '#/components/parameters/InstalledAdapterIdPath'
    get:
      tags: [Integrations]
      summary: Get one installed adapter (hydrated install from YAML or legacy DB)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdapterPackageOne'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Integrations]
      summary: >-
        Update install configuration YAML for this adapter (configJson, contextJson, outputProfiles, emitEnabled,
        ingestCanonicalEnabled, scheduleCron). At least one body field required. Does not store install blob in DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchInstalledAdapterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdapterPackageOne'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags: [Integrations]
      summary: Uninstall adapter — removes DB row and deletes YAML file data/adapter-install-config/{adapterKey}.install.yaml
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdapterUninstall'
        '404':
          $ref: '#/components/responses/NotFound'

  /uns/parks/{parkId}/tree:
    get:
      tags: [UNS]
      summary: Get UNS tree by park
      description: >-
        Requires **integrations.read**. Returns `{ success, data }` where **`data`** is an array of root UNS nodes
        with nested **`children`**. Leaf nodes may include derived Sparkplug topic hints (`sparkplugTopic`, etc.).
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string, description: Park scope key (UUID string for platform parks). }
      responses:
        '200':
          description: UNS hierarchy roots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsTree' }
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.read
  /uns/parks/{parkId}/nodes:
    post:
      tags: [UNS]
      summary: Create UNS node
      description: Requires **integrations.manage**. Validates parent belongs to the same **`parkId`** when provided.
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsNodeCreate' }
      responses:
        '201':
          description: Created node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsNodeMutation' }
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.manage
        '404':
          description: Parent node not found for this park
        '422':
          description: Joi / domain validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /uns/nodes/{id}:
    put:
      tags: [UNS]
      summary: Update UNS node
      description: Requires **integrations.manage**. At least one mutable field required (see `UnsNodeUpdate`).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsNodeUpdate' }
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsNodeMutation' }
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.manage
        '404':
          description: Node not found
        '422':
          description: Validation failure or empty patch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
    delete:
      tags: [UNS]
      summary: Delete UNS node
      description: Requires **integrations.manage**.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: No content
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.manage
        '404':
          description: Node not found
  /uns/parks/{parkId}/latest-state:
    get:
      tags: [UNS]
      summary: Get latest UNS topic values for park
      description: >-
        Requires **integrations.read**. Returns rows from **`uns_latest_states`** for the park (`topicPath`, JSON payload,
        `eventTime`, `quality`, `source`), ordered by **`eventTime`** descending.
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest persisted UNS scalars / payloads per topic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsLatestStateList' }
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.read
  /uns/parks/{parkId}/topics:
    get:
      tags: [UNS]
      summary: List generated active UNS topics
      description: >-
        Requires **integrations.read**. Returns active leaf nodes with derived Sparkplug topic strings for the given
        **`sparkplugMessageType`** (default **`DDATA`**). Other values follow Sparkplug B rules (`NBIRTH`, `DBIRTH`, …).
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
        - in: query
          name: sparkplugMessageType
          required: false
          schema:
            type: string
            enum: [NBIRTH, NDEATH, DBIRTH, DDEATH, DDATA, NCMD, DCMD, STATE]
            default: DDATA
      responses:
        '200':
          description: Topic explorer rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsTopicsList' }
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.read

  /uns/parks/{parkId}/hierarchy-schema:
    get:
      tags: [UNS]
      summary: Export UNS hierarchy schema JSON for a park
      description: >-
        Requires **integrations.read**. Returns a JSON document (not the usual `{ success, data }` envelope)
        with `Content-Disposition: attachment` for download. Shape matches import body (`schemaVersion`, `kind`,
        `roots`, etc.).
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Hierarchy export JSON body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnsHierarchyExportDocument' }
    put:
      tags: [UNS]
      summary: Import UNS hierarchy schema (merge or replace)
      description: >-
        Requires **integrations.manage**. Query **`mode`**: `merge` (default) or `replace` (destructive).
        Body is a `smartpark.uns.hierarchy` document (`schemaVersion: 1`). Response uses the standard envelope
        with a summary object (`created`, `updated`, `skippedLocked`, etc.).
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [merge, replace], default: merge }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsHierarchyImportBody' }
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsHierarchyImportSummary' }
        '422':
          description: Validation / document mismatch

  /uns/parks/{parkId}/hierarchy-schema/preview:
    post:
      tags: [UNS]
      summary: Dry-run hierarchy schema import
      description: >-
        Requires **integrations.read**. Same body and **`mode`** query as **PUT** `/uns/parks/{parkId}/hierarchy-schema`,
        but simulates the import and returns preview data without persisting (except validation paths that fail early).
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [merge, replace], default: merge }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsHierarchyImportBody' }
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsHierarchyImportSummary' }
        '422':
          description: Validation error

  /uns/parks/{parkId}/mqtt-live/events:
    get:
      tags: [UNS]
      summary: Sparkplug MQTT live buffer snapshot for UNS Live
      description: >-
        Requires **integrations.read**. In-memory broker-fed buffer only (not a DB query). Optional **`limit`**
        query (1–2000, default 500). `parkId` path param is slugified for Sparkplug group id matching.
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: Flattened Sparkplug rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsMqttLiveEvents' }

  /uns/parks/{parkId}/mqtt-live/status:
    get:
      tags: [UNS]
      summary: MQTT connector state and live-buffer stats for admin
      description: Requires **integrations.read**. Returns MQTT client state, buffer counters, and adapter simulation flag.
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsMqttLiveStatus' }

  /uns/parks/{parkId}/mqtt-live/test-event:
    post:
      tags: [UNS]
      summary: Publish a synthetic canonical-derived Sparkplug test event
      description: >-
        Requires **integrations.manage**. Uses `canonicalToSparkplug` publisher; **503** `MQTT_UNAVAILABLE` when
        publish fails or MQTT disabled.
      parameters:
        - in: path
          name: parkId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Publish result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsMqttLiveTestPublish' }
        '503':
          description: MQTT publish failed or disabled

  /uns/test/publish:
    post:
      tags: [UNS]
      summary: Publish UNS test message to MQTT
      description: >-
        Requires **integrations.manage**. Publishes **`payload`** JSON to **`topic`** via the configured MQTT client.
        Fails at runtime when MQTT is not connected (server error path — not a stable HTTP contract in all environments).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsTestPublishRequest' }
      responses:
        '200':
          description: Publish acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsTestPublish' }
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.manage

  /uns-registry/mirror/summary:
    get:
      tags: [UNS]
      summary: UNS registry mirror — aggregate counts (mirrored legacy projection)
      description: >-
        Requires **integrations.read**. Triggers stale sync from legacy platform tables when needed; returns
        counts for mirrored registry entities, mappings, topics, metadata, signal catalog, ride capabilities, and
        Sparkplug metric definitions.
      responses:
        '200':
          description: Summary counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsRegistryMirrorSummary' }

  /uns-registry/entities:
    get:
      tags: [UNS]
      summary: List mirrored UNS registry entities
      description: Requires **integrations.read**. Optional filters **`parkId`**, **`entityKind`**, pagination.
      parameters:
        - in: query
          name: parkId
          schema: { type: string, format: uuid, nullable: true }
        - in: query
          name: entityKind
          schema: { type: string, maxLength: 64 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paged registry entity rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsPagedObjects' }

  /uns-registry/topics:
    get:
      tags: [UNS]
      summary: List mirrored UNS registry topics
      description: Requires **integrations.read**. Optional **`parkId`** filter and pagination.
      parameters:
        - in: query
          name: parkId
          schema: { type: string, format: uuid, nullable: true }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paged topic rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsPagedObjects' }

  /uns-spy/events:
    get:
      tags: [UNS]
      summary: List UNS Spy discovery events (MQTT observe + adapter discovery)
      description: >-
        Requires **integrations.read** OR **rides.read**. Optional `eventSource` filters rows:
        `adapter` = `details.source=adapter` (ThemeParks discovery inbox); `mqtt` = other rows; `all` = default (no filter).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: classification
          schema: { type: string, maxLength: 40 }
        - in: query
          name: topicPrefix
          schema: { type: string, maxLength: 500 }
        - in: query
          name: eventSource
          schema:
            type: string
            enum: [mqtt, adapter, all]
            default: all
      responses:
        '200':
          description: Paged discovery events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsSpyDiscoveryEvents' }
              examples:
                adapterFilter:
                  summary: eventSource=adapter
                  value:
                    success: true
                    data:
                      total: 1
                      limit: 50
                      offset: 0
                      items:
                        - id: 00000000-0000-4000-8000-000000000001
                          classification: NEW
                          topicPath: smartpark/{parkId}/rides/ext-123/state
                          details:
                            source: adapter
                            reviewStatus: PENDING
                            externalEntityId: ext-123
                          createdAt: '2026-05-01T12:00:00.000Z'
                          updatedAt: '2026-05-01T12:00:00.000Z'
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.read and rides.read
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: Insufficient permissions
                    code: FORBIDDEN

  /uns-spy/proposals:
    get:
      tags: [UNS]
      summary: List UNS topic proposals (UNS Spy observe pipeline)
      description: >-
        Requires **integrations.read** OR **rides.read**. Paged rows from `uns_topic_proposals`; optional **`status`**
        filter.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: status
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Paged proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsPagedObjects' }
        '401': { description: Missing or invalid JWT }
        '403': { description: Missing integrations.read and rides.read }

  /uns-spy/events/{id}/approve:
    post:
      tags: [UNS]
      summary: Approve an adapter-sourced discovery event (map to existing ride asset)
      description: >-
        Requires **integrations.manage** OR **rides.update**. Phase 12: maps external entity to an existing
        `park_assets` ride row via `external_entity_mappings`, updates event `details.reviewStatus=APPROVED`,
        optionally applies ride template and prepares UNS registry topics (prepared/inactive only). Does **not**
        create `uns_nodes` and does **not** publish MQTT from this handler.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsSpyDiscoveryApproveRequest' }
      responses:
        '200':
          description: Approval result (mapped entity, optional template/prepare summary)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsSpyDiscoveryApproveResult' }
              examples:
                approved:
                  value:
                    success: true
                    data:
                      eventId: 00000000-0000-4000-8000-000000000010
                      mappedEntityId: 00000000-0000-4000-8000-000000000020
                      templateApplied: false
                      preparedUnsTopics:
                        created: 0
                        updated: 0
        '401':
          description: Missing or invalid JWT
        '403':
          description: Missing integrations.manage and rides.update
        '404':
          description: Discovery event or target ride asset not found
        '409':
          description: Event already approved (code `ALREADY_APPROVED`)
          content:
            application/json:
              examples:
                alreadyApproved:
                  value:
                    success: false
                    message: Event already approved
                    code: ALREADY_APPROVED
        '422':
          description: Validation error, not an adapter event (`NOT_ADAPTER_EVENT`), or unsupported body (`createEntity` not supported)
          content:
            application/json:
              examples:
                notAdapter:
                  value:
                    success: false
                    message: Discovery event is not adapter-sourced
                    code: NOT_ADAPTER_EVENT
                joiMissingMap:
                  value:
                    success: false
                    message: Validation failed
                    code: VALIDATION_ERROR

  /uns-spy/events/{id}/reject:
    post:
      tags: [UNS]
      summary: Reject an adapter-sourced discovery event
      description: Requires **integrations.manage** OR **rides.update**. Sets `details.reviewStatus=REJECTED`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsSpyDiscoveryActionResult' }
              examples:
                rejected:
                  value:
                    success: true
                    data:
                      eventId: 00000000-0000-4000-8000-000000000002
                      reviewStatus: REJECTED
        '401': { description: Missing or invalid JWT }
        '403': { description: Missing permission }
        '404':
          description: Event not found
          content:
            application/json:
              examples:
                notFound:
                  value: { success: false, message: Discovery event not found, code: NOT_FOUND }
        '422': { description: Not an adapter-sourced event }

  /uns-spy/events/{id}/ignore:
    post:
      tags: [UNS]
      summary: Ignore an adapter-sourced discovery event
      description: Requires **integrations.manage** OR **rides.update**. Sets classification IGNORED and reviewStatus IGNORED.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsSpyDiscoveryActionResult' }
              examples:
                ignored:
                  value:
                    success: true
                    data:
                      eventId: 00000000-0000-4000-8000-000000000003
                      reviewStatus: IGNORED
        '401': { description: Missing or invalid JWT }
        '403': { description: Missing permission }
        '404': { description: Event not found }
        '422': { description: Not an adapter-sourced event }

