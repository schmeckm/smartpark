      description: "Needs **`agent.run`** and **`X-Park-Id`**. Loads the source run's **`skillId`** and **`input_json`** (`crowdEventId`, `rideId`), then executes the skill again with **`triggerType: replay`** and **`meta_json.replayOfRunId`**.\n"
