    delete:
      tags:
        - AI
      summary: 'Archive or permanently delete ML Studio model row'
      description: "Needs **`ai.refresh`** and **`X-Park-Id`**.\nDefault (no query): **soft-archive** — fails with **`MODEL_ACTIVE`** if still active, or **`MODEL_LAST_DEPLOYABLE_VERSION`** if last non-archived row in slot.\nWith **`permanent=true`**: **hard-delete** the DB row; only allowed when the row is already archived (`archivedAt` set). Otherwise **`MODEL_NOT_ARCHIVED`** (409).\n"
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        -
          in: query
          name: permanent
          required: false
          description: 'If `true`, permanently remove the row from the database (archived rows only).'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGenericData'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Not found'
        '409':
          description: 'Governance conflict (e.g. MODEL_ACTIVE, MODEL_NOT_ARCHIVED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
