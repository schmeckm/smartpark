openapi: 3.0.3
info:
  title: Smart Park OS API
  description: |
    AI-enabled operations backend for large venues. Realtime updates are broadcast via Socket.IO
    (events `zones:updated`, `events:created`, `recommendations:created`, `recommendations:updated`,
    `ai:forecast:updated`, `ai:recommendation-scored`, `canonical:message:received`,
    `canonical:message:applied`, `canonical:message:failed`, `external:mapping:updated`, `external:parkdata:updated`).
  version: 1.7.2

servers:
  - url: /api/v1
    description: Version 1

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Health
  - name: Audit
  - name: Zones
  - name: Rides
  - name: Staff
  - name: Events
  - name: Recommendations
  - name: Dashboard
  - name: Wave2
  - name: AI
  - name: Integrations
  - name: UNS
  - name: MDM
  - name: Platform
  - name: Operations
    description: |
      Shared **Operations Facts** layer — normalized KPI envelopes (`value`, `status`, `quality`, `source`, `updatedAt`)
      for Add-on Board and SQDCP/SWDEC. See `docs/architecture/operations-facts-layer.md` and `docs/architecture/source-of-truth.md`.
  - name: SQDC
  - name: Incidents
  - name: Admin
  - name: VisitPlanning
  - name: OperationsAdapters

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/db:
    get:
      tags: [Health]
      summary: Database connectivity
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDbResponse'
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (database)
      description: Returns 200 when PostgreSQL accepts a connection; 503 when authentication fails. No JWT.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyFailureResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: OK
  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs (OPERATIONS_MANAGER, SECURITY_MANAGER, ADMIN)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: OK

  /zones:
    get:
      tags: [Zones]
      summary: List zones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Zone'
    post:
      tags: [Zones]
      summary: Create zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Zone'

  /zones/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Zones]
      summary: Get zone by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Zone'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Zones]
      summary: Update zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Zone'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Zones]
      summary: Delete zone
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/NotFound'

  /rides:
    get:
      tags: [Rides]
      summary: List rides
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ride'
    post:
      tags: [Rides]
      summary: Create ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'

  /rides/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Rides]
      summary: Get ride by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rides]
      summary: Update ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Ride'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rides]
      summary: Delete ride
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/NotFound'

  /staff:
    get:
      tags: [Staff]
      summary: List staff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Staff'
    post:
      tags: [Staff]
      summary: Create staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Staff'

  /staff/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Staff]
      summary: Get staff by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Staff'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Staff]
      summary: Update staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Staff'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Staff]
      summary: Delete staff member
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/NotFound'

  /events:
    get:
      tags: [Events]
      summary: List crowd events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrowdEvent'
    post:
      tags: [Events]
      summary: Create crowd event
      description: |
        When `eventType` is `CROWD_SPIKE` and crowd exceeds 75% of the zone `maxCapacity`, the service
        evaluates staffing, security posture, and ride wait times to create recommendations.
        By default the zone `currentCrowdLevel` is synced from `crowdLevel` (`syncZone: false` opts out).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrowdEventCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CrowdEvent'
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'

  /recommendations:
    get:
      tags: [Recommendations]
      summary: List recommendations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'

  /recommendations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Recommendations]
      summary: Update recommendation workflow status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [OPEN, ACCEPTED, REJECTED, COMPLETED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Recommendation'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Operational dashboard summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardSummary'

  /mqtt/status:
    get:
      tags: [Wave2]
      summary: MQTT connector status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/MqttStatus' }

  /mqtt/capability-guard/status:
    get:
      tags: [Wave2]
      summary: MQTT capability guard status (Phase 13)
      description: Requires **integrations.read** OR **rides.read**. Returns mode, pilot allow-list size, and inbound decision counts (24h).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      mode: { type: string, enum: [off, warn_only, enforce] }
                      allowedRideCount: { type: integer }
                      lastBlockedAt: { type: string, format: date-time, nullable: true }
                      blockedLast24h: { type: integer }
                      warnedLast24h: { type: integer }
                      allowedLast24h: { type: integer }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }

  /mqtt/inbound:
    get:
      tags: [Wave2]
      summary: List raw inbound MQTT rows
      description: Requires **integrations.read** OR **rides.read**.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: topicPrefix
          schema: { type: string, maxLength: 500 }
        - in: query
          name: spyClassification
          schema: { type: string, maxLength: 40 }
        - in: query
          name: capabilityDecision
          schema: { type: string, enum: [ALLOW, WARN, BLOCK, SKIP] }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }

  /mqtt/inbound/unknown:
    get:
      tags: [UNS]
      summary: List UNS Spy discovery rows for unknown / conflict classifications
      description: >-
        Requires **integrations.read** OR **rides.read**. Returns paged `uns_discovery_events` where
        `classification` is unknown-topic, unknown-signal, or conflict (same store as UNS Spy), optionally
        including linked `mqtt_inbound_message` rows.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: topicPrefix
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Paged discovery events (UNS Spy store)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeUnsPagedObjects' }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }

  /integration/logs:
    get:
      tags: [Wave2]
      summary: Integration / ingestion log
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: OK }
  /weather/current:
    get:
      tags: [Wave2]
      summary: Latest weather observation
      responses:
        '200': { description: OK }
  /weather/observations:
    post:
      tags: [Wave2]
      summary: Ingest a weather observation (API)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeatherCreate' }
      responses:
        '201': { description: Created }
  /import/staff:
    post:
      tags: [Wave2]
      summary: Import staff CSV/XLSX (multipart)
      requestBody:
        content:
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } }
      responses: { '200': { description: OK } }
  /import/rides:
    post:
      tags: [Wave2]
      summary: Import rides
      requestBody:
        content:
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } }
      responses: { '200': { description: OK } }
  /import/zones:
    post:
      tags: [Wave2]
      summary: Import zones
      requestBody:
        content:
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } }
      responses: { '200': { description: OK } }
  /simulator/status:
    get:
      tags: [Wave2]
      summary: Simulator status
      responses: { '200': { description: OK } }
  /simulator/start:
    post:
      tags: [Wave2]
      summary: Start simulator background loop
      responses: { '200': { description: OK } }
  /simulator/stop:
    post:
      tags: [Wave2]
      summary: Stop simulator
      responses: { '200': { description: OK } }
  /simulator/scenario:
    post:
      tags: [Wave2]
      summary: Run one named scenario
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses: { '200': { description: OK } }
  /data-quality/issues:
    get:
      tags: [Wave2]
      summary: List data quality issues
      responses: { '200': { description: OK } }
  /data-quality/issues/{id}/resolve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Wave2]
      summary: Mark issue resolved
      responses: { '200': { description: OK } }

  /ai/health:
    get:
      tags: [AI]
      summary: AI module health
      description: Liveness and sampling config (unauthenticated, no RBAC)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAiHealth' }

  /ai/pipeline-health:
    get:
      tags: [AI]
      summary: Last AI full-pipeline run and scheduler config
      description: Needs `ai.read`. Optional smoke hints from `data/ai-smoke-status.json` when present.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true

  /ai/forecasts/refresh:
    post:
      tags: [AI]
      summary: Sample zones and regenerate baseline crowd forecasts
      description: Needs permission `ai.refresh`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAiRefresh' }

  /ai/forecasts:
    get:
      tags: [AI]
      summary: List current forecasts
      description: Optional filters; needs `ai.read`
      parameters:
        - in: query
          name: horizonMinutes
          schema: { type: integer, minimum: 1 }
        - in: query
          name: subjectType
          schema: { type: string, enum: [PARK, ZONE, RIDE] }
        - in: query
          name: targetMetric
          schema: { type: string, enum: [CROWD_LEVEL, WAIT_TIME, STAFF_DEMAND] }
        - in: query
          name: limit
          schema: { type: integer, default: 100, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeForecasts' }

  /ai/insights/summary:
    get:
      tags: [AI]
      summary: Top hotspot summary (60 min baseline)
      description: Needs `ai.read`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAiInsights' }

  /ai/studio/feature-drafts:
    get:
      tags: [AI]
      summary: Get ML Studio dataset feature draft (Phase P)
      description: Needs `ai.read` and active park context (`X-Park-Id`). Returns persisted draft or `data: null`.
      parameters:
        - in: query
          name: entityType
          required: true
          schema: { type: string, enum: [ride, park_asset] }
        - in: query
          name: entityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: datasetScope
          schema: { type: string, enum: [single_asset], default: single_asset }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAiStudioFeatureDraftNullable' }
    put:
      tags: [AI]
      summary: Save ML Studio dataset feature draft (Phase P)
      description: |
        Needs `ai.refresh` and active park. Each `selectedSignalKey` must exist on ride/asset extensions with `enabled` and `mlEligible`
        (validated via the same **`signal-preview.service`** module as Add-on Board preview gates — **no** `signalPreview` or latest-value fields in this API).
        Stored in `app_settings` key `aiStudio.featureDrafts` (JSON), scoped by park.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiStudioFeatureDraftPut' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeAiStudioFeatureDraft' }

  /ai/parks/{externalParkId}/forecast/summary:
    get:
      tags: [AI]
      summary: Park wait forecast summary (baseline + X + ML enterprise)
      description: Needs `ai.read`. Response `data` includes `mlFactorCurrents` (object, possibly empty).
      parameters:
        - in: path
          name: externalParkId
          required: true
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string, example: themeparks_wiki }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeParkForecastSummary' }

  /ai/parks/{externalParkId}/forecast/series:
    get:
      tags: [AI]
      summary: Interpolated wait forecast points from latest summary
      description: Needs `ai.read`. Does not return `mlFactorCurrents` (series only).
      parameters:
        - in: path
          name: externalParkId
          required: true
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: horizon
          schema: { type: integer, default: 60 }
        - in: query
          name: step
          schema: { type: integer, default: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /ai/parks/{externalParkId}/forecast/explanation:
    get:
      tags: [AI]
      summary: Short textual explanation of park forecast delta
      description: Needs `ai.read`. Does not return `mlFactorCurrents`.
      parameters:
        - in: path
          name: externalParkId
          required: true
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: horizon
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, additionalProperties: true }

  /ai/entities/{externalEntityId}/forecast/summary:
    get:
      tags: [AI]
      summary: Entity (ride) wait forecast summary
      description: Needs `ai.read`. Query `externalParkId` required. `data` includes `mlFactorCurrents` when merge ran.
      parameters:
        - in: path
          name: externalEntityId
          required: true
          schema: { type: string }
        - in: query
          name: externalParkId
          required: true
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: entityType
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeParkForecastSummary' }

  /ai/parks/{externalParkId}/entities/forecast/summary:
    get:
      tags: [AI]
      summary: Batch entity forecast summaries for a park
      description: Needs `ai.read`. Each item includes `mlFactorCurrents` when merge ran.
      parameters:
        - in: path
          name: externalParkId
          required: true
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 150 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeParkForecastSummaryList' }

  /ai/feature-store/park-snapshots/{id}:
    delete:
      tags: [AI]
      summary: Delete one park feature snapshot row
      description: Needs `ai.refresh` and X-Park-Id; row must belong to that park.
      parameters:
