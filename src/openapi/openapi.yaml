      description: "Requires **`iotOt.settings.read`** or **`rides.read`**. Provide **`assetId`** or **`assetSlug`** (one required);\noptional **`messageType`** (`DDATA`, `DBIRTH`, `DDEATH`, `NBIRTH`, `NDEATH`).\n"
