          name: status
          schema:
            type: string
            maxLength: 40
      responses:
        '200':
          description: 'Paged proposals'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUnsPagedObjects'
        '401':
          description: 'Missing or invalid JWT'
        '403':
          description: 'Missing integrations.read and rides.read'
  '/uns-spy/proposals/{id}/approve':
    post:
      tags:
        - UNS
      summary: 'Approve an MQTT-linked UNS topic proposal (Phase T.1)'
      description: 'Requires **integrations.manage** OR **rides.update**. For proposals created from MQTT inbound discovery (`uns_topic_proposals` linked to `uns_discovery_events` with `mqtt_inbound_message_id` set): validates ride + signal catalog, merges `ride_signal_capabilities` (OPERATOR_CONFIGURED), prepares `uns_registry_topics` (`PREPARED_OPERATOR`), optionally prepares Sparkplug metrics when **`signalSource` = `MQTT_EDGE`**, and optionally activates prepared rows. Sets proposal **`status` = `approved`**. TPUNS proposals must match the canonical topic path for the selected ride and catalog signal.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsSpyMqttProposalApproveRequest'
      responses:
        '200':
          description: 'Registry topic prepared/activated and proposal marked approved'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUnsSpyMqttProposalApproveResult'
        '401':
          description: 'Missing or invalid JWT'
        '403':
          description: 'Missing integrations.manage and rides.update'
        '404':
          description: 'Proposal not found'
        '409':
          description: 'Proposal not pending'
        '422':
          description: 'Validation error, not an MQTT-linked proposal, topic mismatch, or domain not supported'
  '/uns-spy/proposals/{id}/reject':
    post:
      tags:
        - UNS
      summary: 'Reject an MQTT-linked UNS topic proposal (Phase T.1)'
      description: 'Requires **integrations.manage** OR **rides.update**. Marks proposal **`status` = `rejected`**; does not create registry topics or change live UNS state.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
