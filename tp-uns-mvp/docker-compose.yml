version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tpuns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - tpuns_pg_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: .
    depends_on:
      - postgres
      - mosquitto
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tpuns
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_SUBSCRIBE: tpuns/+/v1/#
      MQTT_CLIENT_ID: tpuns-backend
      SWAGGER_ENABLED: 'true'
    ports:
      - '3000:3000'
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start"

volumes:
  tpuns_pg_data:
