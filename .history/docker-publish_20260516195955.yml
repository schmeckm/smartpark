name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches:
      - main  # Die Pipeline startet, sobald Code in den 'main' Branch gepusht wird

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode aus GitHub auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Am Docker Hub Konto anmelden
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker Buildx einrichten (für optimierte Builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. BACKEND IMAGE bauen und pushen
      - name: Build and Push Backend API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-park-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-park-backend:${{ github.sha }}

      # 5. FRONTEND IMAGE bauen und pushen
      - name: Build and Push Frontend UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin-dashboard/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-park-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-park-frontend:${{ github.sha }}
